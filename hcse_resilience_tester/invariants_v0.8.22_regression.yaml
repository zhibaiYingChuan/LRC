# INV-REG-P01: /health 端点 AtomicBool 无锁读取（P0-1）
- id: "INV-REG-P01"
  name: "/health 使用 AtomicBool 无锁读取，worker 线程耗尽已消除"
  severity: "P0"
  category: "线程池隔离"
  fix_point: "P0-1"
  description: |
    v0.8.22 P0-1 修复：/health 端点原使用 state.llm_api.read().await.is_configured()
    阻塞式读锁，当 tokio runtime 繁忙时此 .await 点堆积请求，每个消耗一个 worker
    线程，导致所有 16 个 worker 线程被耗尽，HTTP 服务器完全无法响应（12s 超时）。
    修复：改用 AtomicBool 无锁读取（state.llm_configured_atomic.load(Relaxed)），
    永远不阻塞；update_llm_config 时同步更新 AtomicBool。
  code_refs:
    - file: "src/server.rs"
      lines: "1734"  # let llm_configured = state.llm_configured_atomic.load(...)
    - file: "src/server.rs"
      lines: "2135,2187"  # llm_configured_atomic.store(false/true, Relaxed)
    - file: "src/bin/server.rs"
      lines: "774"  # AppState 初始化 AtomicBool::new(llm_api.is_configured())
  assertion: |
    /health 端点响应时间必须 < 100ms（AtomicBool 无锁读取，O(1)）。
    并发 20 次 /health 请求时，所有请求 P99 < 200ms。
    即使模拟合成负载（lock_busy=true）期间，/health 仍 < 100ms。
  cdp_verification:
    event: "Network.responseReceived"
    url_pattern: "/health"
    assert: "response.timing.waitingTime < 100 且 statusCode == 200"
    concurrency_test: "20 并发请求 P99 < 200ms"
  on_violation: "INV-REG-P01 违反：AtomicBool 修复未生效，/health 仍阻塞"
  remediation: |
    1. 确认 src/server.rs:1734 使用 llm_configured_atomic.load 而非 llm_api.read().await
    2. 确认 update_llm_config 在 set/clear 时同步 store AtomicBool

# INV-REG-P02: index_project 移入 spawn_blocking（P0-2）
- id: "INV-REG-P02"
  name: "index_project 在 spawn_blocking 中执行，不阻塞 tokio worker"
  severity: "P0"
  category: "CPU 密集型隔离"
  fix_point: "P0-2"
  description: |
    v0.8.22 P0-2 修复：index_project 是 CPU 密集型操作（遍历文件 + 编码），
    原实现直接在 tokio worker 线程上执行，项目较大时长时间占用 worker 线程，
    导致 HTTP 服务器无法响应其他请求。
    修复：将 index_project 移入 tokio::task::spawn_blocking，在独立阻塞线程执行，
    返回 (bg_mgr, result) 元组保留管理器实例到 async 上下文。
  code_refs:
    - file: "src/bin/server.rs"
      lines: "807-810"  # spawn_blocking(move || { (bg_mgr, result) })
  assertion: |
    1. 索引完成后 /health 的 indexing.complete == true（证明 spawn_blocking 正常返回）
    2. indexing.file_count > 0（索引产出有效）
    3. 索引阶段（启动后 5s 内）/health 仍可响应 < 2000ms
  cdp_verification:
    event: "Network.responseReceived"
    assert: "/health 响应含 indexing.complete=true 且 file_count>0"
  on_violation: "INV-REG-P02 违反：spawn_blocking 未生效，索引阻塞 runtime"
  remediation: "确认 src/bin/server.rs:807 使用 spawn_blocking 包裹 index_project"

# INV-REG-P03: luoshu_synthesize 移入 spawn_blocking（P0-3）
- id: "INV-REG-P03"
  name: "luoshu_synthesize 在 spawn_blocking + blocking_lock 中执行"
  severity: "P0"
  category: "CPU 密集型隔离"
  fix_point: "P0-3"
  description: |
    v0.8.22 P0-3 修复：luoshu_synthesize 是 CPU 密集型操作（加载全部记忆 + 聚类 +
    合成），原实现在 tokio worker 线程上持锁执行（store.lock().await），阻塞 async
    runtime 导致 HTTP 服务器无响应（12s 超时）。
    修复：使用 tokio::task::spawn_blocking + store_arc.blocking_lock()，在独立阻塞
    线程上执行合成。安全性：blocking_lock 不占用 tokio worker 线程，后台流水线与
    HTTP 请求无循环依赖不会死锁，P: Send + 'static 已保证。
  code_refs:
    - file: "src/consolidation.rs"
      lines: "369-370"  # spawn_blocking(move || { store_arc.blocking_lock() })
  assertion: |
    1. /health 的 lock_busy 字段可读（合成状态可观测）
    2. 模拟合成负载期间，/health 响应 < 2000ms（spawn_blocking 不阻塞 worker）
    3. 合成完成后 lock_busy 恢复为 false
  cdp_verification:
    event: "Network.responseReceived"
    assert: "lock_busy 字段存在且为 boolean；合成期间 /health < 2000ms"
  on_violation: "INV-REG-P03 违反：spawn_blocking 未生效，合成阻塞 runtime"
  remediation: "确认 src/consolidation.rs:369 使用 spawn_blocking + blocking_lock"

# INV-REG-P04: 503 错误 30s 冷却期，防止 toast 风暴（P0-4）
- id: "INV-REG-P04"
  name: "503 lock_busy 错误 30s 冷却期，30s 内最多 1 次 toast"
  severity: "P0"
  category: "UI 韧性"
  fix_point: "P0-4"
  description: |
    v0.8.22 P0-4 修复：handleHttpError 503 分支原无冷却期，lock_busy 期间每次
    请求失败都弹 toast，形成 toast 风暴（每秒可能 5-10 个 toast）。
    修复：添加 30s 冷却期（lockBusyCooldownKey），冷却期内仅 console.log 不弹
    toast。冷却期内剩余秒数有日志可追踪。
  code_refs:
    - file: "static/app.js"
      lines: "288-297"  # 30s 冷却期逻辑
  assertion: |
    1. 连续触发 5 次 503 错误，30s 内 toast 出现次数 <= 1
    2. 冷却期内 console.log 包含"冷却期内，跳过 toast"
    3. 冷却期过后再次 503 可弹新 toast
  cdp_verification:
    event: "domMutated + Runtime.consoleAPICalled"
    steps:
      - "evaluate: 注入 5 次 503 响应到 handleHttpError"
      - "DOM 查询 .toast 元素数量 <= 1"
      - "console 日志含 '冷却期内' 文本"
  on_violation: "INV-REG-P04 违反：30s 冷却期未生效，toast 风暴"
  remediation: "确认 app.js:291 now - lastToastTime > 30000 判断逻辑"

# INV-REG-P12: 503 错误无自动重试（P1-2）
- id: "INV-REG-P12"
  name: "handleHttpError 503 分支不自动重试，避免双重重试"
  severity: "P1"
  category: "重试策略"
  fix_point: "P1-2"
  description: |
    v0.8.22 P1-2 修复：handleHttpError 原 503 分支有自动重试 1 次，而
    loadDashboard/loadDaoMetrics 也有自己的 LOCK_BUSY 重试机制，形成双重重试，
    实际请求次数翻倍。
    修复：去掉 handleHttpError 的 503 自动重试，直接返回 action='cancel'，
    由上层调用者的重试机制接管。
  code_refs:
    - file: "static/app.js"
      lines: "298-299"  # return { action: 'cancel' }
  assertion: |
    handleHttpError 对 503 响应必须返回 { action: 'cancel' }，不得返回 'retry'。
    evaluate: handleHttpError(new Response(null,{status:503})) → action === 'cancel'
  cdp_verification:
    event: "Runtime.evaluate"
    assert: "handleHttpError(503响应).action === 'cancel'"
  on_violation: "INV-REG-P12 违反：503 仍自动重试，双重重试未消除"
  remediation: "确认 app.js:299 503 分支返回 cancel 而非 retry"

# INV-REG-P13: pendingRequestCount 计数器不泄漏（P1-3）
- id: "INV-REG-P13"
  name: "pendingRequestCount 重试路径不双重减少，永不变为负数"
  severity: "P1"
  category: "资源计数完整性"
  fix_point: "P1-3"
  description: |
    v0.8.22 P1-3 修复：fetchWithTimeout 重试路径原在递归调用前手动
    pendingRequestCount--，而 finally 块又减一次，导致每次重试净减 1，计数器
    逐渐泄漏（可能变为负数），beforeunload 拦截逻辑失效。
    修复：去掉手动减少，由 finally 块统一管理计数器生命周期。
  code_refs:
    - file: "static/app.js"
      lines: "139-144"  # 注释说明修复：去掉手动减少
    - file: "static/app.js"
      lines: "179"  # finally: pendingRequestCount--（唯一减少点）
  assertion: |
    1. window.pendingRequestCount >= 0（任何时候不得为负）
    2. 触发重试路径后，pendingRequestCount 不出现负值
    3. 空闲态 pendingRequestCount === 0
  cdp_verification:
    event: "Runtime.evaluate"
    assert: "window.pendingRequestCount >= 0 且空闲态 === 0"
  on_violation: "INV-REG-P13 违反：计数器泄漏为负值"
  remediation: "确认 app.js:144 重试路径无手动 pendingRequestCount--"

