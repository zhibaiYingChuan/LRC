# INV-V0822-P0A: tokio worker_threads=16，健康端点不被合成阻塞
- id: "INV-V0822-P0A"
  name: "tokio worker 线程数提升至 16，lock_busy 期间 /health 可达"
  severity: "P0"
  category: "线程池隔离"
  description: |
    v0.8.21 P0-A 失败根因：合成任务是 CPU 密集型，通过 tokio::spawn 启动后
    占用 worker 线程，当所有 worker 线程（默认 CPU 核心数 4-8）被占用时，
    axum handler 无法执行，/health 等端点超时（5-8s 无响应）。
    v0.8.22 修复：worker_threads 提升至 16，确保合成任务占用部分线程后，
    axum handler 仍有足够线程处理请求。
  code_refs:
    - file: "src/bin/server.rs"
      lines: "52-59"  # #[tokio::main(flavor = "multi_thread", worker_threads = 16)]
  assertion: |
    sidecar 进入 lock_busy=true 状态后：
      - /health 端点必须在 2000ms 内返回 200 + lock_busy=true
      - /v1/health/dao_metrics 必须在 2000ms 内返回 200 或 503 lock_busy
      - /v1/health/system 必须在 2000ms 内返回 200 或 503 lock_busy
      - /v1/health/detailed 必须在 2000ms 内返回 200 或 503 lock_busy
    若任一端点 > 5000ms 才响应，判定 INV-V0822-P0A 违反。
  cdp_verification:
    event: "Network.responseReceived"
    url_pattern: "/v1/health/"
    assert: "response.timing.waitingTime < 2000"
    on_violation: "INV-V0822-P0A 违反：tokio worker_threads=16 修复未生效，端点仍被阻塞"
  remediation: |
    1. 确认 src/bin/server.rs:59 已应用 worker_threads=16
    2. 后续优化：将 run_cycle 中的 CPU 密集型操作放到 spawn_blocking（v0.8.23 计划）

# INV-V0822-IA01: loadDaoMetrics AbortController，标签页切换取消旧请求
- id: "INV-V0822-IA01"
  name: "loadDaoMetrics AbortController，快速切换标签页时旧请求被取消"
  severity: "P1"
  category: "竞态防护"
  description: |
    v0.8.22 IA-01 修复：loadDaoMetrics 未使用 AbortController，快速切换标签页时
    旧请求继续运行，sidecar lock_busy 时返回 503，产生大量 console 错误。
    修复：新增 daoAbortController 变量，每次调用前 abort 上一次请求；
    _abortActiveTabRequests 中切换离开 dashboard 时 abort daoAbortController。
  code_refs:
    - file: "static/app.js"
      lines: "5249-5271"  # daoAbortController + loadDaoMetrics 入口
    - file: "static/app.js"
      lines: "6414-6421"  # _abortActiveTabRequests 切换离开 dashboard 时 abort
    - file: "static/app.js"
      lines: "5321-5325"  # AbortError 视为预期行为
  assertion: |
    1. window.daoAbortController 变量存在（通过 evaluate 检查）
    2. 触发 loadDaoMetrics 后，daoAbortController 不为 null
    3. 切换离开 dashboard 标签页时，旧 daoAbortController 被 abort（signal.aborted=true）
    4. AbortError 不触发 toast 错误提示（视为预期行为）
  cdp_verification:
    event: "Network.requestWillBeSent + Network.loadingFailed"
    steps:
      - "evaluate: typeof daoAbortController !== 'undefined'"
      - "evaluate: loadDaoMetrics() 后 daoAbortController.signal.aborted === false"
      - "evaluate: 切换标签页后 旧 signal.aborted === true"
      - "console: 不应出现 AbortError 的 toast"
    on_violation: "INV-V0822-IA01 违反：AbortController 未生效或切换标签页时未取消旧请求"
  remediation: "确保 daoAbortController 在 loadDaoMetrics 入口和 _abortActiveTabRequests 中正确管理"

# INV-V0822-IA02: 全局错误处理，未捕获异常显示 toast
- id: "INV-V0822-IA02"
  name: "全局错误处理注册，未捕获异常对用户有 toast 反馈"
  severity: "P1"
  category: "全局错误兜底"
  description: |
    v0.8.22 IA-02 修复：window.onerror 和 onunhandledrejection 均未注册，
    未捕获异常对用户完全无反馈。修复：注册两个全局监听器，显示 toast。
    使用 _lrcGlobalErrorRegistered 标志避免重复注册。
  code_refs:
    - file: "static/app.js"
      lines: "2787-2808"  # window.addEventListener('error'/'unhandledrejection')
  assertion: |
    1. window._lrcGlobalErrorRegistered === true（已注册标志）
    2. 注入未捕获 Promise rejection 后，DOM 中出现 toast 元素
    3. toast 文本不为空，包含错误信息
  cdp_verification:
    event: "Runtime.exceptionThrown + domMutated"
    steps:
      - "evaluate: window._lrcGlobalErrorRegistered === true"
      - "evaluate: 注入 Promise.reject(new Error('HCSE-IA02-test'))"
      - "DOM 查询 .toast 或 .toast-message 出现且包含错误文本"
    on_violation: "INV-V0822-IA02 违反：全局错误处理未注册或未显示 toast"
  remediation: "确保 window.addEventListener 在 init() 中被调用，且 showToast 函数可用"

