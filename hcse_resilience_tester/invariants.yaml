# HCSE 硬安全不变量定义（v0.8.33 / L1-L5 韧性审计专用）
# 每条不变量均为 CDP RV-Monitor 在运行时实时断言的绝对命题。
# 违反任一不变量 → 立即终止用例 + 生成 Invariant Violation Report + 录屏。
---
invariants:
  # ===== L1 一级页面（MCP配置向导 Step1） =====
  - id: INV-L1-01
    layer: L1
    title: "扫描超时UI兜底不变量"
    description: >
      当 scan_ide_projects IPC 调用从 request 到 responseReceived 间隔 >20s 时，
      3s 内必须出现以下任一可观察 DOM 证据：
        a) 含"取消"文本的可点击按钮（data-action=cancel 或 id=scan-cancel-btn）；
        b) .loading-spinner 容器 + 超过 80% 宽度的进度文案（或 cancel button）；
        c) showToast 触发包含"超时/扫描"字样的 warning/error toast。
    severity: P0
    assert: |
      event.type == 'ipc:scan_ide_projects:timeout'
        implies (within(3s, 'dom.toast:warning|error')
                 or within(3s, 'dom.query:button:contains(取消):visible')
                 or within(3s, 'dom.query:.loading-spinner:visible'))
    evidence_cdp: ["Network.requestWillBeSent", "Network.responseReceived",
                   "Runtime.consoleAPICalled", "DOM.querySelector", "Page.screencastFrame"]

  - id: INV-L1-02
    layer: L1
    title: "卡死路径30sUI恢复不变量"
    description: >
      DotDirDetector/collect_shortcut_dirs 若永不返回（通过 CDP 注入 sleep 或 mock 永不
      resolve 的 Promise），从调用起点起 30s±2s 窗口内：
        1) 前端必须显示「重新扫描」按钮；
        2) scan_ide_projects 的 Promise 必须被 reject（window.error 或 console.error）；
        3) UI 不能残留未清理的 loading-spinner（5s 内消失）。
    severity: P0
    assert: |
      inject_stall('agent_detector.collect_shortcut_dirs')
        implies (within(32s, 'dom.query:button:contains(重新扫描):visible')
                 and within(32s, 'ipc:scan_ide_projects:rejected')
                 and within(35s, 'dom.query_missing:.loading-spinner'))
    evidence_cdp: ["Runtime.evaluate", "Network.loadingFailed",
                   "Page.screencastFrame", "Runtime.exceptionThrown"]

  # ===== L2 二级弹窗（项目删除确认） =====
  - id: INV-L2-01
    layer: L2
    title: "删除确认幂等不变量"
    description: >
      连续 3 次触发"项目删除确认"弹窗，且用户连续点击"取消/关闭"：
        a) confirm-modal DOM 中不能出现 3 个叠加（必须 ≤1 个 data-role=confirm-modal visible）；
        b) showConfirm 内部队列 confirmModalQueue 长度 ≤5（从 window.confirmModalQueue 读）；
        c) 最后一次关闭后 1s 内，无 pending 的 delete-project IPC 调用。
    severity: P1
    assert: |
      repeat(action=openDeleteProjectConfirm, times=3, click=cancel)
        implies (count('dom.query:.confirm-modal:visible') <= 1
                 and len(window.confirmModalQueue) <= 5
                 and within(1s, count_pending_ipc('delete-project') == 0))
    evidence_cdp: ["DOM.getDocument", "Runtime.evaluate",
                   "Network.requestWillBeSent", "DOM.querySelector"]

  # ===== L3 三级卡片（AI工具检测卡片） =====
  - id: INV-L3-01
    layer: L3
    title: "工具卡片检测-状态一致性不变量"
    description: >
      任意单个 AI 工具卡片：checkbox 的最终 checked 状态必须与卡片右侧
      data-role=tool-status 的"已检测到/未安装"文本语义一致（手动修正徽章出现时除外）：
        - status == "已检测到" => checked=true OR data-role=manual-override-badge visible
        - status == "未安装" => checked=false OR badge visible
    severity: P1
    assert: |
      for_each card in 'dom.query:[data-agent-id]' :
        (card.status == '已检测到' implies (card.checkbox.checked or card.badge.visible))
        and
        (card.status == '未安装' implies (not card.checkbox.checked or card.badge.visible))
    evidence_cdp: ["DOM.querySelectorAll", "Runtime.evaluate", "Page.screencastFrame"]

  # ===== L4 四级嵌套（齿轮菜单+手动修正+缓存失效） =====
  - id: INV-L4-01
    layer: L4
    title: "手动修正写入失败状态回滚不变量"
    description: >
      当 set_agent_manual_override 写入 wizard.json 返回 Err（磁盘只读/权限不足/
      速率限制429）时：
        1) localStorage['lrc_agent_manual_overrides_v1'] 中该 agent_id 的值在用户
           点击齿轮菜单右上角 X 关闭后 500ms 内恢复为关闭前的原值；
        2) 工具卡片 data-role=manual-override-badge 的 display 必须与
           localStorage 当前值同步；
        3) showToast 必须出现包含"本地临时生效，重启后可能丢失"或"写入失败"的
           warning/error 提示。
    severity: P0
    assert: |
      inject_error('ipc:set_agent_manual_override', err='EACCES')
        and user_action('gear_menu_close_x')
          implies (
            within(500ms, local_storage('lrc_agent_manual_overrides_v1')[agentId] == originalValue)
            and within(800ms, badge_display_sync_with_ls())
            and within(1500ms, 'dom.toast:warning|error:contains(本地临时生效|写入失败)')
          )
    evidence_cdp: ["Network.loadingFailed", "Runtime.evaluate",
                   "DOM.querySelector", "Page.screencastFrame"]

  - id: INV-L4-02
    layer: L4
    title: "扫描缓存失效ID一致性不变量"
    description: >
      点击「重新扫描（清空缓存）」按钮后，必须严格按顺序完成 3 步：
        ① force_invalidate_scan_cache → Ok；
        ② discover_all_agents 重新执行（Network 中存在新 requestId）；
        ③ get_scan_cache_metadata 返回的 timestamp_ms 必须 > 调用前的旧 timestamp_ms
          （若后端调用距 1970-01-01 < 1s 或为 0 视为异常 → showToast 报错）。
      若 ① 失败，②③ 仍必须可执行且 ③ 结果 不 出现 valid=true 且 timestamp_ms 不变。
    severity: P1
    assert: |
      sequence(
        action('rescanToolsWithInvalidate'),
        order(
          ipc('lrc-force-invalidate-scan-cache'),
          ipc('lrc-discover-all-agents'),
          ipc('lrc-get-scan-cache-metadata'): { new_ts > old_ts or new_ts == 0 and not valid }
        )
      )
    evidence_cdp: ["Network.requestWillBeSent", "Network.responseReceived",
                   "Runtime.evaluate", "Page.screencastFrame"]

  # ===== L5 异常全局（CDP断连/侧载进程崩溃） =====
  - id: INV-L5-01
    layer: L5
    title: "IPC超时8s熔断不变量"
    description: >
      对 discover_all_agents / lrc-force-invalidate-scan-cache 两个 IPC，
      若后端持续挂起（>=9s 无 response）：
        1) postMessageToParent 必须在 8s±0.5s 内 reject，错误含"超时"关键字；
        2) 前端 1s 内必须出现：AbortController.signal.aborted === true 或
           window.__testHooks 中对应 AbortController 引用 abort 状态为 true；
        3) 熔断后 3s 内 showToast 触发，且同一条错误 toast 在 1.5s 去重窗口不重复>2次。
    severity: P0
    assert: |
      for ipc_name in ['lrc-discover-all-agents','lrc-force-invalidate-scan-cache']:
        stall_ipc(ipc_name, duration=9500ms)
          implies (
            within(8500ms, ipc(ipc_name):rejected and error_msg_contains('超时'))
            and within(9500ms, abort_signal_for(ipc_name).aborted === true)
            and within(11000ms, 'dom.toast:warning|error')
            and dedup_count(toast_same_key, 1500ms) <= 2
          )
    evidence_cdp: ["Network.requestWillBeSent", "Network.loadingFailed",
                   "Runtime.evaluate", "Runtime.exceptionThrown",
                   "Page.screencastFrame", "Browser.getVersion"]

  - id: INV-L5-02
    layer: L5
    title: "侧载进程崩溃UI自愈合不变量"
    description: >
      通过 Runtime.evaluate 模拟向 sidecar pid 发送 SIGKILL / taskkill：
        1) 5s 内 sidecar-crash 事件必须触发或 get_sidecar_status 返回空数组；
        2) 10s 内状态栏必须从绿色"运行中"转为红色/灰色"不可达"；
        3) 20s 内用户可见"启动服务"按钮可点击（disabled=false）；
        4) 仪表盘所有数据卡片不得残留"索引中/加载中"永久占位（30s 内显示错误提示或重试按钮）。
    severity: P0
    assert: |
      kill_process(sidecar_pid)
        implies (
          within(5s,  event('sidecar-crash')  or get_sidecar_status() == [])
          and within(10s, dom.status_bar_color() in {red, gray})
          and within(20s, dom.query:'#btn-start-service:enabled')
          and within(30s, no_pending_loading_spinner_on_dashboard())
        )
    evidence_cdp: ["Runtime.evaluate", "Network.responseReceived",
                   "Page.screencastFrame", "Target.attachedToTarget",
                   "Browser.getVersion"]

# ===== 超时机制对照（供 rv_monitor.py 与 Phase3 断言参考） =====
timeout_sla:
  - ipc: discover_all_agents
    frontend_ms: 30000
    backend_ms: null                 # null 表示后端无 tokio::time::timeout 包装（风险点）
    breaker: postMessageToParent.race + setTimeout
    # ===== HCSE 测试注入：将前端超时从默认 30s 压缩到 6s，确保 6.5s 内真实触发 =====
    test_override_ms: 6000
    test_expect_toast: "AI工具检测超时，请重试"
  - ipc: set_agent_manual_override
    frontend_ms: 15000
    backend_ms: null
    breaker: rate_limiter should_throttle ("cmd:set_agent_manual_override")
    test_override_ms: 1500
    test_expect_toast: "本地临时生效，重启后可能丢失"
  - ipc: get_scan_cache_metadata
    frontend_ms: 8000
    backend_ms: 0                    # 纯内存读，理论 <1ms
    breaker: postMessageToParent setTimeout
  - ipc: force_invalidate_scan_cache
    frontend_ms: 8000
    backend_ms: null
    breaker: rate_limiter should_throttle ("cmd:force_invalidate_scan_cache")
    # HCSE 测试：压缩到 800ms，确认 RateLimiter (300ms 窗口) 第 2 次立即拦截 429
    test_override_ms: 800
    test_ratelimit_window_ms: 300
    test_expect_toast: "请求过于频繁"
  - ipc: scan_ide_projects
    frontend_ms: 30000
    backend_ms: 30000                # commands.rs:1359 tokio::time::timeout(30s)
    breaker: backend + frontend double-wrapped
    # 注：static/app.js:5441 实际传 60000ms，与 invariants 默认不一致
    test_override_ms: 6000
    test_expect_toast: "扫描 IDE 项目失败"

# ===== 路径白名单（Phase6 TEE 沙箱） =====
sandbox:
  allowed_path_prefixes:
    - "./temp"
    - "./logs"
    - "./screenshots"
    - "./evidence"
  max_memory_mb: 1024
  max_cpu_seconds: 60

sanitization:
  drop_cookie_value: true
  redact_authorization_header: "[BEARER_TOKEN_REDACTED]"
  redact_fields: ["email", "phone", "api_key", "encrypted_api_key"]
