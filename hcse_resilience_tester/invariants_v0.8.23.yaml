# INV-V0823-P201: 代理检测工具函数（E4 修复）
- id: "INV-V0823-P201"
  name: "detectProxyConfiguration 函数存在且可运行时调用"
  severity: "P2"
  category: "代理检测"
  fix_point: "P2-01 (E4)"
  description: |
    v0.8.23 P2-01 (E4) 修复：Sidecar 不可达时无代理检测，
    用户看到"无法连接"而反复重试。修复：
    1. 新增 detectProxyConfiguration() 异步函数，检测系统代理配置
    2. 在 SidecarHealthMonitor 不可达时调用 _detectProxyAndUpdateBanner
    3. 检测到代理时 banner 显示代理信息，否则显示默认文案
  code_refs:
    - file: "static/app.js"
      lines: "141-235"  # detectProxyConfiguration
    - file: "static/app.js"
      lines: "837-859"  # _detectProxyAndUpdateBanner
    - file: "static/app.js"
      lines: "815-816"  # 不可达时调用 _detectProxyAndUpdateBanner
  assertion: |
    1. window.detectProxyConfiguration 为函数（CDP evaluate 验证）
    2. detectProxyConfiguration() 返回 Promise，resolve 对象含 likelyProxy/reason/online 字段
    3. SidecarHealthMonitor._detectProxyAndUpdateBanner 为函数
    4. 不可达时 banner 文本包含代理信息或默认文案
  cdp_verification:
    event: "Runtime.evaluate"
    steps:
      - "evaluate: typeof window.detectProxyConfiguration === 'function'"
      - "evaluate: detectProxyConfiguration().then(r => r.likelyProxy !== undefined && r.reason !== undefined)"
      - "evaluate: typeof SidecarHealthMonitor._detectProxyAndUpdateBanner === 'function'"
    on_violation: "INV-V0823-P201 违反：代理检测函数不存在或不可调用"
  remediation: "确认 app.js:141-235 和 app.js:837-859 代码正确加载"

