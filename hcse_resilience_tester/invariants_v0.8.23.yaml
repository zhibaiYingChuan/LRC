# INV-V0823-P203: 502/504 网关错误自动重试（P2-03 修复）
- id: "INV-V0823-P203"
  name: "502/504 网关错误自动重试（指数退避，不弹阻塞 Modal）"
  severity: "P2"
  category: "重试策略"
  fix_point: "P2-03"
  description: |
    v0.8.23 P2-03 修复：502/504 仅显示 toast，无自动重试。
    修复：handleHttpError 新增 502/504 分支，自动重试 3 次，
    指数退避（1s/2s/4s），首次重试时 toast 提示，后续静默。
    超过重试上限显示"服务暂时不可用"。
  code_refs:
    - file: "static/app.js"
      lines: "443-489"  # 502/504 分支
  assertion: |
    1. handleHttpError 对 502 返回 { action: 'retry' }（首次重试）
    2. handleHttpError 对 504 返回 { action: 'retry' }（首次重试）
    3. 重试 3 次后返回 { action: 'giveup' }
    4. 重试期间显示 toast 提示（首次）
    5. 支持 retryContext.signal 取消退避
  cdp_verification:
    event: "Runtime.evaluate"
    steps:
      - "evaluate: handleHttpError(new Response(null,{status:502})).then(r => r.action === 'retry')"
      - "evaluate: handleHttpError(new Response(null,{status:504})).then(r => r.action === 'retry')"
      - "evaluate: 模拟 3 次重试后 action === 'giveup'"
    on_violation: "INV-V0823-P203 违反：502/504 重试机制未生效"
  remediation: "确认 app.js:443-489 502/504 分支逻辑正确"

# INV-V0823-OBS01: loadTrustCenter AbortController（OBS-01 修复）
- id: "INV-V0823-OBS01"
  name: "loadTrustCenter AbortController，标签页切换取消旧请求"
  severity: "P2"
  category: "竞态防护"
  fix_point: "OBS-01"
  description: |
    v0.8.23 OBS-01 修复：loadTrustCenter 未使用 AbortController，
    快速切换标签页时旧请求继续运行，可能产生竞态。
    修复：新增 trustAbortController 变量，每次调用前 abort 上一次请求；
    AbortError 静默处理，不显示错误 UI。
  code_refs:
    - file: "static/app.js"
      lines: "2484-2521"  # trustAbortController 定义与使用
    - file: "static/app.js"
      lines: "2581-2585"  # AbortError 静默处理
  assertion: |
    1. window.trustAbortController 变量存在（或可访问）
    2. 调用 loadTrustCenter 后，trustAbortController 不为 null
    3. 再次调用 loadTrustCenter 时，旧 trustAbortController 被 abort
    4. AbortError 不触发 toast 错误提示（console.log 静默处理）
  cdp_verification:
    event: "Runtime.evaluate"
    steps:
      - "evaluate: typeof window.trustAbortController !== 'undefined' 或 loadTrustCenter 源码中信任 AbortController 存在"
      - "源码验证：AbortError 分支 return 而非 showToast"
    on_violation: "INV-V0823-OBS01 违反：loadTrustCenter AbortController 未生效"
  remediation: "确认 app.js:2484-2521 trustAbortController 正确管理"

# INV-V0823-A02: signal 传递到 handleHttpError（A-02 修复）
- id: "INV-V0823-A02"
  name: "fetchWithTimeout 传递 externalSignal 到 handleHttpError，使退避延迟可取消"
  severity: "P2"
  category: "信号传播"
  fix_point: "A-02"
  description: |
    v0.8.23 A-02 修复：fetchWithTimeout 的 externalSignal 未传递到
    handleHttpError，导致标签页切换后退避延迟仍继续执行。
    修复：fetchWithTimeout 构建 retryContext 时传递 signal: externalSignal；
    handleHttpError 在 500/502/504 退避延迟中监听 signal.abort。
  code_refs:
    - file: "static/app.js"
      lines: "255-256"  # retryContext 传递 signal
    - file: "static/app.js"
      lines: "396-417"  # 500 退避支持 signal 取消
    - file: "static/app.js"
      lines: "467-488"  # 502/504 退避支持 signal 取消
  assertion: |
    1. fetchWithTimeout 中 retryContext.signal 为 externalSignal
    2. handleHttpError 500 分支 signal 不为 undefined 时监听 abort
    3. handleHttpError 502/504 分支 signal 不为 undefined 时监听 abort
    4. AbortError 退避取消时返回 { action: 'cancel' }
  cdp_verification:
    event: "Runtime.evaluate"
    steps:
      - "源码验证：retryContext 构建含 signal: externalSignal"
      - "源码验证：500/502/504 分支 signal.addEventListener('abort', ...)"
    on_violation: "INV-V0823-A02 违反：signal 未传递或退避不可取消"
  remediation: "确认 app.js:255-256 和 396-417/467-488 的 signal 传播逻辑"

