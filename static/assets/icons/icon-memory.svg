<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- 九宫格九点，中心略大 -->
  <!-- 中心点（略大） -->
  <circle cx="12" cy="12" r="2" fill="#ffffff" stroke="none"/>
  <!-- 四角点 -->
  <circle cx="5" cy="5" r="1.2" fill="#ffffff" stroke="none"/>
  <circle cx="19" cy="5" r="1.2" fill="#ffffff" stroke="none"/>
  <circle cx="5" cy="19" r="1.2" fill="#ffffff" stroke="none"/>
  <circle cx="19" cy="19" r="1.2" fill="#ffffff" stroke="none"/>
  <!-- 边中点 -->
  <circle cx="12" cy="5" r="1.2" fill="#ffffff" stroke="none"/>
  <circle cx="12" cy="19" r="1.2" fill="#ffffff" stroke="none"/>
  <circle cx="5" cy="12" r="1.2" fill="#ffffff" stroke="none"/>
  <circle cx="19" cy="12" r="1.2" fill="#ffffff" stroke="none"/>
  <!-- 虚线九宫格连线 -->
  <g stroke-dasharray="1,2" opacity="0.3">
    <line x1="5" y1="5" x2="19" y2="5"/>
    <line x1="5" y1="12" x2="19" y2="12"/>
    <line x1="5" y1="19" x2="19" y2="19"/>
    <line x1="5" y1="5" x2="5" y2="19"/>
    <line x1="12" y1="5" x2="12" y2="19"/>
    <line x1="19" y1="5" x2="19" y2="19"/>
  </g>
</svg>



