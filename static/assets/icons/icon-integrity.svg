<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- 完整性校验：哈希链——三个链接环 + 中心封印，象征不可篡改的审计链 -->
  <!-- 左侧链环 -->
  <ellipse cx="6" cy="12" rx="3" ry="2.5" fill="none" stroke="#ffffff"/>
  <!-- 中间链环（与左右相交） -->
  <ellipse cx="12" cy="12" rx="3" ry="2.5" fill="none" stroke="#ffffff"/>
  <!-- 右侧链环 -->
  <ellipse cx="18" cy="12" rx="3" ry="2.5" fill="none" stroke="#ffffff"/>
  <!-- 中心封印（实心圆，高亮） -->
  <circle cx="12" cy="12" r="1.2" fill="#ffffff" stroke="none"/>
  <!-- 上下校验标记 -->
  <line x1="9" y1="6" x2="15" y2="6" stroke="#ffffff" opacity="0.5"/>
  <line x1="9" y1="18" x2="15" y2="18" stroke="#ffffff" opacity="0.5"/>
</svg>



