<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
  <!-- 3×3 九宫格，格内中文大写数字一至九，中心"五"高亮 -->
  <!-- 九宫格外框 -->
  <rect x="3" y="3" width="18" height="18" rx="1" fill="none" stroke="#ffffff"/>
  
  <!-- 九宫格分割线 -->
  <line x1="9" y1="3" x2="9" y2="21"/>
  <line x1="15" y1="3" x2="15" y2="21"/>
  <line x1="3" y1="9" x2="21" y2="9"/>
  <line x1="3" y1="15" x2="21" y2="15"/>
  
  <!-- 数字（洛书顺序：戴九履一，左三右七，二四为肩，六八为足，五居中央） -->
  <!-- 第一行：四 九 二 -->
  <text x="6" y="7.5" text-anchor="middle" font-family="'Noto Serif SC', serif" font-size="5" fill="#ffffff" stroke="none">四</text>
  <text x="12" y="7.5" text-anchor="middle" font-family="'Noto Serif SC', serif" font-size="5" fill="#ffffff" stroke="none">九</text>
  <text x="18" y="7.5" text-anchor="middle" font-family="'Noto Serif SC', serif" font-size="5" fill="#ffffff" stroke="none">二</text>
  
  <!-- 第二行：三 五 七 -->
  <text x="6" y="13.5" text-anchor="middle" font-family="'Noto Serif SC', serif" font-size="5" fill="#ffffff" stroke="none">三</text>
  <text x="12" y="13.5" text-anchor="middle" font-family="'Noto Serif SC', serif" font-size="6" font-weight="700" fill="#ffffff" stroke="none">五</text>
  <text x="18" y="13.5" text-anchor="middle" font-family="'Noto Serif SC', serif" font-size="5" fill="#ffffff" stroke="none">七</text>
  
  <!-- 第三行：八 一 六 -->
  <text x="6" y="19.5" text-anchor="middle" font-family="'Noto Serif SC', serif" font-size="5" fill="#ffffff" stroke="none">八</text>
  <text x="12" y="19.5" text-anchor="middle" font-family="'Noto Serif SC', serif" font-size="5" fill="#ffffff" stroke="none">一</text>
  <text x="18" y="19.5" text-anchor="middle" font-family="'Noto Serif SC', serif" font-size="5" fill="#ffffff" stroke="none">六</text>
</svg>



