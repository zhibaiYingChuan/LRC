<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- 隐私设置：锁形 + 钥匙孔，象征数据加密与隐私保护 -->
  <!-- 锁体（圆角矩形） -->
  <rect x="5" y="10" width="14" height="10" rx="2" fill="none" stroke="#ffffff"/>
  <!-- 锁梁（弧形） -->
  <path d="M 8 10 V 7 C 8 4.5 9.5 3 12 3 C 14.5 3 16 4.5 16 7 V 10" fill="none" stroke="#ffffff"/>
  <!-- 钥匙孔 -->
  <circle cx="12" cy="14.5" r="1.5" fill="none" stroke="#ffffff"/>
  <!-- 钥匙孔下方延伸 -->
  <line x1="12" y1="16" x2="12" y2="18" stroke="#ffffff"/>
</svg>



