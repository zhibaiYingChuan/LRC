name: "用户痛点与体验反馈"
description: "易用性、文档、错误提示、安装配置等方面的反馈——48 小时内响应"
title: "[体验反馈] "
labels: ["ux-feedback", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## 感谢你的反馈！
        
        每一条体验反馈都是帮我们把产品"翻译"得更好的机会。
        对于**非算法类**的反馈（易用性、文档、错误提示等），我们承诺 **48 小时内**给出解决方案或修正版本。

  - type: dropdown
    id: category
    attributes:
      label: "反馈类型"
      description: "你觉得哪里体验不好？"
      options:
        - "文档不清晰或缺少信息"
        - "启动/安装过程遇到困难"
        - "错误提示看不懂"
        - "命令行参数/配置不直观"
        - "工具描述（AI 看到的）不够准确"
        - "搜索效果不如预期"
        - "记忆功能没达到预期"
        - "其他（请描述）"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: "描述你的体验"
      description: "你做了什么？期望发生什么？实际发生了什么？"
      placeholder: |
        例：
        1. 我照着 README 配置了 MCP
        2. 期望 AI 能自动搜索代码
        3. 但 AI 说"我没有可用的搜索工具"
    validations:
      required: true

  - type: textarea
    id: what-expected
    attributes:
      label: "你期望的体验是什么样的？"
      description: "如果让你来设计，你希望它怎么工作？"
      placeholder: "我希望什么都不配置，装完就能用..."
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: "环境信息"
      description: "帮助我们复现你的问题"
      placeholder: |
        - 操作系统：Windows 11 / macOS 14 / Ubuntu 24.04
        - IDE：Trae / Cursor / VS Code
        - 安装方式：源码编译 / Release 二进制
        - 搜索模式：Fast Match / Smart Match
        - 版本号（如果知道）：
      value: |
        - 操作系统：
        - IDE：
        - 安装方式：
        - 搜索模式：
        - 版本号：
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: "相关日志或截图（可选）"
      description: "启动日志、错误信息、或截图——任何能帮助我们快速定位的信息"
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: "提交前确认"
      options:
        - label: "这不是算法效果/搜索精度的问题（这类问题请使用 Bug Report 模板）"
          required: false
        - label: "我已经搜索过已有的 Issue，确认没有重复"
          required: true