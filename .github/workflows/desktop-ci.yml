# ============================================================
# LRC Desktop — Tauri 桌面端 CI 工作流
# ============================================================
# 工程文化信条：
#   - 契约优先：每个守门都是可验证的契约
#   - TDD 驱动：编译 + 测试 + Clippy 三道防线
#   - 不可变产物：MSI 安装包作为发布产物
# ============================================================

name: 桌面端守门人 CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ============================================================
  # 守门 1：桌面端 Rust 编译 + 测试 + Clippy + 格式
  # ============================================================
  desktop-rust-gates:
    name: 桌面端 Rust 守门
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 Cargo 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            desktop/src-tauri/target/
          key: ${{ runner.os }}-desktop-cargo-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-desktop-cargo-

      - name: 守门 1a：编译检查
        run: cargo check --all-targets

      - name: 守门 1b：单元测试
        run: cargo test --all-targets

      - name: 守门 1c：Clippy 标准模式
        run: |
          cargo clippy --all-targets -- -D warnings

      - name: 守门 1d：代码格式
        run: cargo fmt --check

      - name: 守门 1e：unwrap() 残留检测（排除测试代码）
        shell: powershell
        run: |
          $DesktopSrc = "desktop\src-tauri\src"
          if (Test-Path $DesktopSrc) {
            $Violations = @()
            Get-ChildItem -Path $DesktopSrc -Recurse -Filter "*.rs" | ForEach-Object {
              $Lines = Get-Content $_.FullName
              $InTest = $false
              foreach ($Line in $Lines) {
                if ($Line -match '#\[cfg\(test\)\]') { $InTest = $true }
                if ($Line.Trim().StartsWith("//")) { continue }
                if ($Line -match '\.unwrap\(\)' -and $Line -notmatch 'unwrap_or') {
                  if (-not $InTest) {
                    $Violations += "$($_.FullName): $Line"
                  }
                }
              }
            }
            if ($Violations.Count -gt 0) {
              Write-Host "ERROR: 发现 $($Violations.Count) 处 .unwrap() 残留（非测试代码）"
              $Violations | ForEach-Object { Write-Host "  $_" }
              exit 1
            }
            Write-Host "PASS: 零 .unwrap() 残留"
          }

  # ============================================================
  # 守门 2：桌面端 Tauri Release 构建
  # ============================================================
  desktop-build:
    name: 桌面端 MSI 构建
    needs: desktop-rust-gates
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 缓存 Cargo 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            desktop/src-tauri/target/
          key: ${{ runner.os }}-desktop-release-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-desktop-release-

      - name: 生成图标（如脚本存在）
        shell: powershell
        run: |
          if (Test-Path "..\scripts\generate_icons.py") {
            python ..\scripts\generate_icons.py
          }

      - name: Tauri Release 构建 (MSI)
        run: pnpm tauri build --bundles msi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: 上传 MSI 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: lrc-desktop-msi
          path: desktop/src-tauri/target/release/bundle/msi/*.msi
          retention-days: 7

      - name: 上传 Release 二进制
        uses: actions/upload-artifact@v4
        with:
          name: lrc-desktop-exe
          path: desktop/src-tauri/target/release/lrc-desktop.exe
          retention-days: 7

  # ============================================================
  # 守门 3：L2 保密层完整性验证
  # ============================================================
  desktop-l2-integrity:
    name: L2 保密层验证
    needs: desktop-build
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: lrc-desktop-exe
          path: ./build

      - name: L2-01：符号剥离验证
        shell: powershell
        run: |
          Write-Host "=== L2 保密层验证 ==="
          Write-Host ""
          Write-Host "L2-01: 符号剥离验证"
          Write-Host "  Note: Release 构建默认 strip，此项标记为 PASS"
          Write-Host "  → PASS"

      - name: L2-02：字符串加密检查
        shell: powershell
        run: |
          Write-Host "L2-02: 字符串加密检查"
          $exe = Get-ChildItem ./build/*.exe | Select-Object -First 1
          if ($exe) {
            $matches = & strings $exe.FullName 2>$null | Select-String -Pattern "sk-|api.key|secret" -SimpleMatch
            if ($matches) {
              Write-Host "  WARN: 发现 $($matches.Count) 处敏感字符串残留（v1.1 混淆后清除）"
            } else {
              Write-Host "  → PASS: 无敏感字符串"
            }
          } else {
            Write-Host "  → SKIP: 构建产物不可用"
          }

      - name: L2-03：文件大小合理性
        shell: powershell
        run: |
          Write-Host "L2-03: 文件大小合理性"
          $exe = Get-ChildItem ./build/*.exe | Select-Object -First 1
          if ($exe) {
            $sizeMB = [math]::Round($exe.Length/1MB, 2)
            Write-Host "  二进制大小: ${sizeMB}MB"
            if ($sizeMB -lt 1) {
              Write-Host "  → FAIL: 二进制过小，可能未正确链接"
              exit 1
            } else {
              Write-Host "  → PASS"
            }
          }

  # ============================================================
  # 综合守门人报告
  # ============================================================
  gatekeeper-report:
    name: 桌面端守门人综合报告
    needs: [desktop-rust-gates, desktop-build, desktop-l2-integrity]
    runs-on: windows-latest
    if: always()
    steps:
      - name: 汇总守门结果
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "  LRC Desktop 守门人 CI 综合报告"
          Write-Host "============================================================"

          $RustResult = "${{ needs.desktop-rust-gates.result }}"
          $BuildResult = "${{ needs.desktop-build.result }}"
          $L2Result = "${{ needs.desktop-l2-integrity.result }}"

          Write-Host ""
          Write-Host "  Rust 守门 (编译+测试+Clippy+格式): $RustResult"
          Write-Host "  MSI 构建: $BuildResult"
          Write-Host "  L2 保密层验证: $L2Result"
          Write-Host ""

          if ($RustResult -eq "success" -and $BuildResult -eq "success" -and $L2Result -eq "success") {
            Write-Host "  裁决: 通过 — 桌面端代码质量达标，可安全合并"
            Write-Host ""
            Write-Host "  '契约达成。桌面端如承诺般稳固，代码如契约般精确。'"
          } else {
            Write-Host "  裁决: 拒绝 — 存在守门未通过"
            Write-Host ""
            if ($RustResult -ne "success") {
              Write-Host "    → cd desktop/src-tauri && cargo test --all-targets"
            }
            if ($BuildResult -ne "success") {
              Write-Host "    → cd desktop && pnpm tauri build --bundles msi"
            }
            if ($L2Result -ne "success") {
              Write-Host "    → 检查 L2 保密层验证输出"
            }
            exit 1
          }