# ============================================================
# Loong Recall (LRC) 持续集成工作流
# 守门人驱动的质量闸门 —— 任何不合规代码不得合并
# ============================================================
# 工程文化信条：
#   - 契约优先：每个 Job 都是可验证的契约
#   - TDD 驱动：测试是守门的第一道防线
#   - 无指责复盘：CI 失败时输出结构化诊断，聚焦流程而非个人
# ============================================================

name: 守门人 CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ============================================================
  # 守门 1-5：Rust 后端质量守门
  # ============================================================
  rust-gates:
    name: Rust 守门 (编译 + 测试 + Clippy + 格式 + unwrap)
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 Cargo 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-ci-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-ci-

      - name: 守门 1：编译检查
        run: cargo check --all-targets --features server

      - name: 守门 2：单元测试
        run: cargo test --all-targets --features server

      - name: 守门 3：Clippy 标准模式（默认规则零警告）
        run: |
          cargo clippy --all-targets --features server -- `
            -D warnings

      - name: 守门 3b：Clippy 严格模式（pedantic + nursery，仅 main 分支 PR）
        if: github.ref == 'refs/heads/main'
        run: |
          cargo clippy --all-targets --features server -- `
            -W clippy::pedantic `
            -W clippy::nursery `
            -D warnings

      - name: 守门 4：代码格式
        run: cargo fmt --check

      - name: 守门 5：unwrap() 残留检测（排除测试代码）
        shell: powershell
        run: |
          $Violations = @()
          Get-ChildItem -Path src -Recurse -Filter "*.rs" | ForEach-Object {
            $Lines = Get-Content $_.FullName
            $InTest = $false
            $LineNum = 0
            foreach ($Line in $Lines) {
              $LineNum++
              if ($Line -match '#\[cfg\(test\)\]') { $InTest = $true }
              if ($Line.Trim().StartsWith("//")) { continue }
              if ($Line -match '\.unwrap\(\)' -and $Line -notmatch 'unwrap_or') {
                if (-not $InTest) {
                  $Violations += "$($_.FullName):L$LineNum"
                }
              }
            }
          }
          if ($Violations.Count -gt 0) {
            Write-Host "ERROR: 发现 $($Violations.Count) 处 .unwrap() 残留（非测试代码）"
            $Violations | ForEach-Object { Write-Host "  $_" }
            exit 1
          } else {
            Write-Host "PASS: 零 .unwrap() 残留（非测试代码）"
          }

  # ============================================================
  # 守门 6-7：前端质量守门
  # ============================================================
  frontend-gates:
    name: 前端守门 (代码重复 + XSS 安全)
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 守门 6：前端代码重复检测
        shell: powershell
        run: |
          $IndexHtml = "static\index.html"
          if (Test-Path $IndexHtml) {
            $Content = Get-Content $IndexHtml -Raw
            # 检测是否有内联 <script>（非 src 引用）
            $InlineScripts = [regex]::Matches($Content, '<script[^>]*>(?!\s*</script>)([\s\S]*?)</script>')
            $InlineWithoutSrc = $InlineScripts | Where-Object { $_.Value -notmatch 'src=' }
            if ($InlineWithoutSrc.Count -gt 0) {
              Write-Host "FAIL: index.html 包含 $($InlineWithoutSrc.Count) 个内联 <script>，应迁移到 app.js"
              exit 1
            }
            # 检查是否引用了 app.js
            if ($Content -notmatch 'src=["\x27]app\.js["\x27]') {
              Write-Host "WARN: index.html 未引用 app.js"
            }
            Write-Host "PASS: 前端代码无重复"
          }

      - name: 守门 7：前端 XSS 安全检测
        shell: powershell
        run: |
          $JsFiles = @("static\app.js", "static\index.html") | Where-Object { Test-Path $_ }
          $Dangerous = @("innerHTML\s*=", "document\.write\(", "eval\(")
          $Found = $false
          foreach ($File in $JsFiles) {
            $Content = Get-Content $File -Raw
            foreach ($Pattern in $Dangerous) {
              if ($Content -match $Pattern) {
                # 排除已安全转义的使用
                if ($Pattern -eq "innerHTML\s*=" -and $Content -match 'htmlescape\(') {
                  continue
                }
                Write-Host "  FAIL: $File 包含 $Pattern"
                $Found = $true
              }
            }
          }
          if ($Found) {
            exit 1
          }
          Write-Host "PASS: 前端 XSS 安全检查通过"

  # ============================================================
  # 守门 8：算法泄露检测
  # ============================================================
  leak-check:
    name: 守门 8：算法泄露检测
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 运行算法泄露检测
        run: python scripts/check_algorithm_leak.py

  # ============================================================
  # 综合守门人报告
  # ============================================================
  gatekeeper-report:
    name: 守门人综合报告
    needs: [rust-gates, frontend-gates, leak-check]
    runs-on: windows-latest
    if: always()
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 汇总守门结果
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "  守门人 CI 综合报告"
          Write-Host "============================================================"

          $RustResult = "${{ needs.rust-gates.result }}"
          $FrontendResult = "${{ needs.frontend-gates.result }}"
          $LeakResult = "${{ needs.leak-check.result }}"

          $AllPassed = ($RustResult -eq "success" -and $FrontendResult -eq "success" -and $LeakResult -eq "success")

          Write-Host ""
          Write-Host "  Rust 守门 (编译+测试+Clippy+格式+unwrap): $RustResult"
          Write-Host "  前端守门 (代码重复+XSS): $FrontendResult"
          Write-Host "  算法泄露检测: $LeakResult"
          Write-Host ""

          if ($AllPassed) {
            Write-Host "  裁决: 通过 - 所有守门检查通过，代码质量达标"
            Write-Host ""
            Write-Host "  工程文化教练评语:"
            Write-Host "  '契约达成。代码如承诺般可靠，测试如契约般精确。'"
            Write-Host "  '可以安全合并。'"
          } else {
            Write-Host "  裁决: 拒绝 - 存在守门未通过，请修复后重新提交"
            Write-Host ""
            Write-Host "  工程文化教练评语:"
            Write-Host "  '契约未达成。守门人拒绝放行，因为质量承诺尚未兑现。'"
            Write-Host "  '这不是指责，而是保护。请修复上述问题后重新提交。'"
            Write-Host ""
            Write-Host "  修复指引:"
            if ($RustResult -ne "success") {
              Write-Host "    -> 本地运行: .\scripts\gatekeeper.ps1 -Fix"
            }
            if ($FrontendResult -ne "success") {
              Write-Host "    -> 删除 index.html 内联 <script>，仅保留 app.js 引用"
            }
            exit 1
          }