# ============================================================
# Loong Recall (LRC) CI Workflow
# Gatekeeper-driven quality gates - non-compliant code shall not merge
# ============================================================
# Engineering Culture:
#   - Contract First: Each job is a verifiable contract
#   - TDD Driven: Tests are the first line of defense
#   - Blameless Retro: CI failures output structured diagnostics
# ============================================================

name: Gatekeeper CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ============================================================
  # Gate 1-5: Rust Backend Quality Gates
  # ============================================================
  rust-gates:
    name: Rust Gates (build + test + clippy + fmt + unwrap)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-ci-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-ci-

      - name: Gate 1: Compile Check
        run: cargo check --all-targets --features server

      - name: Gate 2: Unit Tests
        run: cargo test --all-targets --features server

      - name: Gate 3: Clippy Standard (zero warnings)
        run: |
          cargo clippy --all-targets --features server -- `
            -D warnings

      - name: Gate 3b: Clippy Strict (pedantic + nursery, main branch PR only)
        if: github.ref == 'refs/heads/main'
        run: |
          cargo clippy --all-targets --features server -- `
            -W clippy::pedantic `
            -W clippy::nursery `
            -D warnings

      - name: Gate 4: Code Format
        run: cargo fmt --check

      - name: Gate 5: unwrap() residue detection (exclude test code)
        shell: powershell
        run: |
          $Violations = @()
          Get-ChildItem -Path src -Recurse -Filter "*.rs" | ForEach-Object {
            $Lines = Get-Content $_.FullName
            $InTest = $false
            $LineNum = 0
            foreach ($Line in $Lines) {
              $LineNum++
              if ($Line -match '#\[cfg\(test\)\]') { $InTest = $true }
              if ($Line.Trim().StartsWith("//")) { continue }
              if ($Line -match '\.unwrap\(\)' -and $Line -notmatch 'unwrap_or') {
                if (-not $InTest) {
                  $Violations += "$($_.FullName):L$LineNum"
                }
              }
            }
          }
          if ($Violations.Count -gt 0) {
            Write-Host "ERROR: Found $($Violations.Count) .unwrap() residue (non-test code)"
            $Violations | ForEach-Object { Write-Host "  $_" }
            exit 1
          } else {
            Write-Host "PASS: Zero .unwrap() residue (non-test code)"
          }

  # ============================================================
  # Gate 6-7: Frontend Quality Gates
  # ============================================================
  frontend-gates:
    name: Frontend Gates (code duplication + XSS)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gate 6: Frontend code duplication check
        shell: powershell
        run: |
          $IndexHtml = "static\index.html"
          if (Test-Path $IndexHtml) {
            $Content = Get-Content $IndexHtml -Raw
            $InlineScripts = [regex]::Matches($Content, '<script[^>]*>(?!\s*</script>)([\s\S]*?)</script>')
            $InlineWithoutSrc = $InlineScripts | Where-Object { $_.Value -notmatch 'src=' }
            if ($InlineWithoutSrc.Count -gt 0) {
              Write-Host "FAIL: index.html contains $($InlineWithoutSrc.Count) inline <script> tags, move to app.js"
              exit 1
            }
            if ($Content -notmatch 'src=["\x27]app\.js["\x27]') {
              Write-Host "WARN: index.html does not reference app.js"
            }
            Write-Host "PASS: No frontend code duplication"
          }

      - name: Gate 7: Frontend XSS security check
        shell: powershell
        run: |
          $JsFiles = @("static\app.js", "static\index.html") | Where-Object { Test-Path $_ }
          $Dangerous = @("innerHTML\s*=", "document\.write\(", "eval\(")
          $Found = $false
          foreach ($File in $JsFiles) {
            $Content = Get-Content $File -Raw
            foreach ($Pattern in $Dangerous) {
              if ($Content -match $Pattern) {
                if ($Pattern -eq "innerHTML\s*=" -and $Content -match 'htmlescape\(') {
                  continue
                }
                Write-Host "  FAIL: $File contains $Pattern"
                $Found = $true
              }
            }
          }
          if ($Found) {
            exit 1
          }
          Write-Host "PASS: Frontend XSS security check passed"

  # ============================================================
  # Gatekeeper Summary Report
  # ============================================================
  gatekeeper-report:
    name: Gatekeeper Report
    needs: [rust-gates, frontend-gates]
    runs-on: windows-latest
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Summarize gate results
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "  Gatekeeper CI Summary Report"
          Write-Host "============================================================"

          $RustResult = "${{ needs.rust-gates.result }}"
          $FrontendResult = "${{ needs.frontend-gates.result }}"

          $AllPassed = ($RustResult -eq "success" -and $FrontendResult -eq "success")

          Write-Host ""
          Write-Host "  Rust Gates  (build+test+clippy+fmt+unwrap): $RustResult"
          Write-Host "  Frontend Gates (code duplication+XSS): $FrontendResult"
          Write-Host ""

          if ($AllPassed) {
            Write-Host "  VERDICT: PASS - All gates passed, code quality meets standards"
            Write-Host ""
            Write-Host "  'Contract fulfilled. Code is as reliable as promised, tests as precise as the contract. Safe to merge.'"
          } else {
            Write-Host "  VERDICT: REJECT - Some gates failed, please fix and resubmit"
            Write-Host ""
            Write-Host "  'Contract not fulfilled. Gatekeeper denies passage because quality promise is not yet met. This is not blame, it is protection.'"
            Write-Host ""
            if ($RustResult -ne "success") {
              Write-Host "    -> Run: cargo test --all-targets --features server"
            }
            if ($FrontendResult -ne "success") {
              Write-Host "    -> Remove inline <script> from index.html, keep only app.js reference"
            }
            exit 1
          }