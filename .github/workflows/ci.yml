name: CI

# v0.7.1 P4-2：E2E 自动化测试接入 CI
# 触发条件：push 到 main/develop 分支、所有 PR
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# v0.8.23 S1-SEC-04：最小权限原则 — CI 只需要读取权限
permissions:
  contents: read

jobs:
  # ════════════════════════════════════════════════════════════
  # Job 1: 代码格式检查（cargo fmt）
  # ════════════════════════════════════════════════════════════
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    # v0.9.7 审查修复（P2-1）：补齐超时保护，避免网络挂起时被 GitHub
    #   以 6 小时默认上限回收，浪费 runner 配额。
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            crates.io:443
            static.crates.io:443
            objects.githubusercontent.com:443
            rustup.rs:443
            static.rust-lang.org:443
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  # ════════════════════════════════════════════════════════════
  # Job 2: Clippy 静态检查（拒绝 warnings）
  # ════════════════════════════════════════════════════════════
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    # v0.9.7 审查修复（P2-1）：补齐超时保护
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            crates.io:443
            static.crates.io:443
            objects.githubusercontent.com:443
            rustup.rs:443
            static.rust-lang.org:443
            index.crates.io:443
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: clippy
      - name: Cache Cargo deps
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-clippy-
      - name: Run clippy (server feature)
        run: cargo clippy --features server -- -D warnings
      - name: Run clippy (default features)
        run: cargo clippy --all-targets -- -D warnings

  # ════════════════════════════════════════════════════════════
  # Job 3: 单元测试 + 集成测试
  # 包含 v1_api.rs 的 22 个 API 契约测试 + server.rs 路径遍历测试
  # ════════════════════════════════════════════════════════════
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    # v0.9.7 审查修复（P2-1）：全仓仅 frontend-test 有 timeout-minutes，
    # 测试作业挂起时会被 GitHub 以 6 小时默认上限才回收，现补显式上限。
    # P2-2 追加 server,ml 测试后编译量上升（candle 全家桶），预算放宽到 45 分钟。
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            crates.io:443
            static.crates.io:443
            objects.githubusercontent.com:443
            rustup.rs:443
            static.rust-lang.org:443
            index.crates.io:443
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - name: Cache Cargo deps
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-test-
      # v0.9.7 审查修复（P0-2）：全仓存在 31 处进程级 set_var 写入
      #   （benchmarks.rs / memory_store.rs / model_downloader.rs / v1_api.rs 等），
      #   libtest 默认多线程并行 → 环境变量互相污染 → 测试非确定性（本地偶发绿、CI 偶发红）。
      #   此处以 --test-threads=1 串行化，消除跨测试环境变量竞态；
      #   后续可按报告建议改为参数注入以恢复并行。
      - name: Run tests (server feature)
        run: cargo test --features server --verbose -- --test-threads=1
      - name: Run tests (default features)
        run: cargo test --verbose -- --test-threads=1
      # v0.9.7 审查修复（P2-2）：此前 build-matrix 仅对 ml/postgres/qdrant/neo4j 做
      #   `cargo check`（只编译不测试），ml feature 全仓零测试执行。
      #   取证结论：ml 相关用例均带"模型缺失即跳过"守卫——
      #     · encoder_codebert.rs::should_skip() 基于 model_resolver::check_model_ready 文件检测；
      #     · v1_api.rs::new_ml_capable_store() 用 LuoShuMlEncoder::load().ok()? 返回 None 后 return；
      #     · luoshu_encoder_ml.rs 的 12 个单测全部走统计模式（new_statistical），不加载模型。
      #   因此 CI（无模型、egress 受限）下可安全执行，不会因缺模型而失败。
      #   postgres/qdrant/neo4j 需真实外部服务，暂不在此接入（见报告 P2-2 待跟踪项）。
      - name: Run tests (server + ml features)
        run: cargo test --features server,ml --verbose -- --test-threads=1

  # ════════════════════════════════════════════════════════════
  # Job 3b: 代码覆盖率门禁（v0.9.7 审查修复 P0-1）
  # 背景：此前全 .github/ Grep codecov|llvm-cov|tarpaulin|coverage = 0 命中，
  #   属"零覆盖率度量"——无法识别未执行分支，回归缺少雷达。
  # 方案：cargo-llvm-cov 生成 lcov 报告 + --fail-under-lines 硬门禁 + artifact 留档。
  # 阈值：40% 为保守起点（首次接入避免历史欠账直接锁死合流），
  #   待 CI 实测基线稳定后按实调升；调整时须同步更新本注释。
  # ════════════════════════════════════════════════════════════
  coverage:
    name: Coverage Gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            crates.io:443
            static.crates.io:443
            index.crates.io:443
            objects.githubusercontent.com:443
            rustup.rs:443
            static.rust-lang.org:443
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          # cargo-llvm-cov 依赖 rustup 的 llvm-tools-preview 组件做插桩
          components: llvm-tools-preview
      - name: Cache Cargo deps
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cov-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cov-
      - name: Install cargo-llvm-cov
        # 与 license-check 同款策略：timeout 限制，防止网络问题导致 CI 挂起
        run: timeout 600 cargo install cargo-llvm-cov --locked
      - name: Run coverage with line threshold
        # --test-threads=1 与 test job 保持一致，规避 set_var 环境变量竞态
        run: |
          cargo llvm-cov --features server --lcov --output-path lcov.info \
            --fail-under-lines 40 -- --test-threads=1
      - name: Upload coverage report
        # 无论门禁是否通过都留档，便于定位未覆盖分支
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: warn
          retention-days: 7

  # ════════════════════════════════════════════════════════════
  # Job 4: E2E Smoke Test
  # 启动 sidecar 二进制，curl 关键端点验证 HTTP 200
  # 验证链路：二进制启动 → HTTP 服务监听 → API 响应正确
  # ════════════════════════════════════════════════════════════
  e2e-smoke:
    name: E2E Smoke Test
    runs-on: ubuntu-latest
    # v0.9.7 审查修复（P2-1）：此前本 Job 无超时保护，
    #   而 sidecar 启动含轮询等待，挂起时会拖到默认 6 小时上限。
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          # v0.8.23 修复：添加 index.crates.io 用于 cargo build，127.0.0.1:3099 用于 curl smoke test
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            crates.io:443
            static.crates.io:443
            objects.githubusercontent.com:443
            rustup.rs:443
            static.rust-lang.org:443
            index.crates.io:443
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Cache Cargo deps
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-e2e-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-e2e-

      - name: Build sidecar binary
        run: cargo build --release --features server

      - name: Start sidecar in background
        # 启动 sidecar，端口 3099，源码目录为当前仓库
        # 使用 nohup + & 后台运行，等待 5 秒让服务就绪
        # v0.8.23 修复：从 3 秒增加到 5 秒，给 sidecar 充足的索引时间
        run: |
          nohup ./target/release/code-memory-server --src-dir . --port 3099 > sidecar.log 2>&1 &
          echo "Sidecar PID: $!"
          sleep 5
          # 验证进程存活
          if ! pgrep -f "code-memory-server"; then
            echo "ERROR: sidecar 启动失败"
            cat sidecar.log
            exit 1
          fi

      - name: Smoke test - /v1/health/system
        # 验证系统健康端点返回 200，并检查响应结构
        # v0.8.23 A-03：降级路径 CI 测试 — 验证 lock_busy 响应结构
        # v0.8.23 修复：添加重试循环，解决 sidecar 启动延迟导致 curl 连接失败的问题
        run: |
          # 重试循环：最多等待 15 秒，每 2 秒重试一次
          for i in $(seq 1 7); do
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3099/v1/health/system 2>/dev/null || echo "000")
            if [ "$RESPONSE" = "200" ]; then
              echo "GET /v1/health/system → HTTP $RESPONSE (第 ${i} 次尝试)"
              break
            fi
            echo "  [第 ${i}/7 次] 等待 sidecar 就绪... (HTTP $RESPONSE)"
            sleep 2
          done
          if [ "$RESPONSE" != "200" ]; then
            echo "FAIL: 期望 200，实际 $RESPONSE"
            cat sidecar.log
            exit 1
          fi
          # 验证 JSON 响应结构（正常路径 & 降级路径均需包含 lock_busy 字段）
          BODY=$(curl -s http://127.0.0.1:3099/v1/health/system)
          echo "响应体: $(echo $BODY | head -c 300)"
          # 检查 lock_busy 字段存在（正常路径=false，降级路径=true）
          if ! echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); assert 'lock_busy' in d, '缺少 lock_busy 字段'; assert isinstance(d['lock_busy'], bool), 'lock_busy 必须是 boolean'" 2>/dev/null; then
            echo "FAIL: 响应结构不符合规范（缺少 lock_busy 字段或类型错误）"
            echo "响应内容: $BODY"
            cat sidecar.log
            exit 1
          fi
          echo "  ✓ 响应结构验证通过（lock_busy 字段存在且为 boolean）"
          # 检查 degraded 字段存在（降级路径=true）
          if ! echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); assert 'degraded' in d, '缺少 degraded 字段'; assert isinstance(d['degraded'], bool), 'degraded 必须是 boolean'" 2>/dev/null; then
            echo "FAIL: 响应结构不符合规范（缺少 degraded 字段或类型错误）"
            echo "响应内容: $BODY"
            cat sidecar.log
            exit 1
          fi
          echo "  ✓ 响应结构验证通过（degraded 字段存在且为 boolean）"

      - name: Smoke test - /v1/memories/stats
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3099/v1/memories/stats)
          echo "GET /v1/memories/stats → HTTP $RESPONSE"
          if [ "$RESPONSE" != "200" ]; then
            echo "FAIL: 期望 200，实际 $RESPONSE"
            cat sidecar.log
            exit 1
          fi

      - name: Smoke test - /v1/encode (POST)
        # 验证编码端点能正确处理请求
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST http://127.0.0.1:3099/v1/encode \
            -H "Content-Type: application/json" \
            -d '{"text":"Rust 开发"}')
          echo "POST /v1/encode → HTTP $RESPONSE"
          if [ "$RESPONSE" != "200" ]; then
            echo "FAIL: 期望 200，实际 $RESPONSE"
            cat sidecar.log
            exit 1
          fi

      - name: Smoke test - /dashboard
        # 验证仪表盘静态资源服务正常
        # 注意：根路径 / 会 302 重定向到 /dashboard，因此直接测试 /dashboard
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3099/dashboard)
          echo "GET /dashboard → HTTP $RESPONSE"
          if [ "$RESPONSE" != "200" ]; then
            echo "FAIL: 期望 200，实际 $RESPONSE"
            cat sidecar.log
            exit 1
          fi

      - name: Smoke test - /v1/model/test (POST)
        # v0.8.25 新增：验证模型测试端点连通性
        # 注意：CI 环境无 ML 模型，预期返回 ok=false + 明确错误信息，而非断言 ok=true
        # 测试目标是验证端点响应结构正确（HTTP 200 + 含必要字段）
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST http://127.0.0.1:3099/v1/model/test \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "POST /v1/model/test → HTTP $RESPONSE"
          if [ "$RESPONSE" != "200" ]; then
            echo "FAIL: 期望 200，实际 $RESPONSE"
            cat sidecar.log
            exit 1
          fi
          # 验证响应结构：ok 可为 true/false，但必须包含 error 或 vector_dim 字段
          BODY=$(curl -s -X POST http://127.0.0.1:3099/v1/model/test -H "Content-Type: application/json" -d '{}')
          echo "响应体: $(echo $BODY | head -c 200)"
          if ! echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); assert 'ok' in d, '缺少 ok 字段'; assert 'error' in d or 'vector_dim' in d, '缺少 error 或 vector_dim'; assert 'elapsed_ms' in d, '缺少 elapsed_ms'" 2>/dev/null; then
            echo "FAIL: /v1/model/test 响应结构不符合规范"
            echo "响应内容: $BODY"
            cat sidecar.log
            exit 1
          fi
          echo "  ✓ /v1/model/test 响应结构验证通过（CI 无模型，预期 ok=false）"

      - name: Smoke test - /v1/version/check (GET)
        # v0.8.25 新增：验证版本检查端点连通性
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3099/v1/version/check)
          echo "GET /v1/version/check → HTTP $RESPONSE"
          if [ "$RESPONSE" != "200" ]; then
            echo "FAIL: 期望 200，实际 $RESPONSE"
            cat sidecar.log
            exit 1
          fi
          # 验证响应包含 current_version 字段
          BODY=$(curl -s http://127.0.0.1:3099/v1/version/check)
          echo "响应体: $(echo $BODY | head -c 200)"
          if ! echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); assert 'current_version' in d, '缺少 current_version'; assert 'latest_version' in d, '缺少 latest_version'; assert 'update_available' in d, '缺少 update_available'" 2>/dev/null; then
            echo "FAIL: /v1/version/check 响应结构不符合规范"
            echo "响应内容: $BODY"
            cat sidecar.log
            exit 1
          fi
          echo "  ✓ /v1/version/check 响应结构验证通过"

      - name: Smoke test - /v1/health/system version field
        # v0.8.25 新增：验证系统健康端点返回 version 字段
        run: |
          BODY=$(curl -s http://127.0.0.1:3099/v1/health/system)
          echo "响应体: $(echo $BODY | head -c 300)"
          if ! echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); assert 'version' in d, '缺少 version 字段'; assert isinstance(d['version'], str), 'version 必须是字符串'" 2>/dev/null; then
            echo "FAIL: /v1/health/system 缺少 version 字段或类型错误"
            echo "响应内容: $BODY"
            cat sidecar.log
            exit 1
          fi
          echo "  ✓ /v1/health/system version 字段验证通过"

      - name: Dump sidecar log on failure
        if: failure()
        run: |
          echo "=== sidecar.log ==="
          cat sidecar.log || true

      - name: Stop sidecar
        if: always()
        run: |
          pkill -f "code-memory-server" || true

  # ════════════════════════════════════════════════════════════
  # Job 5: 跨平台编译验证（确保 Windows/macOS 可编译）
  # ════════════════════════════════════════════════════════════
  build-matrix:
    name: Build Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # v0.9.7 审查修复（P2-1）：3 OS × 7 组 feature 编译 + apt 安装，
    #   此前无超时；apt-get 挂起时会被 GitHub 以 SIGTERM(143) 杀死且日志不可读。
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      # v0.8.24 修复：Windows runner 网络不稳定导致 git clone 失败，
      #   根因：GitHub Actions Windows runner 偶发 TCP 连接重置 / DNS 解析失败，
      #   表现为 fetch-pack: invalid index-pack output / early EOF / curl 56 Recv failure。
      #   使用 continue-on-error + PowerShell 循环重试，最多 3 次，每次等待 30 秒。
      - name: Checkout
        id: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        continue-on-error: true
      - name: Checkout (retry on failure)
        if: steps.checkout.outcome == 'failure'
        shell: pwsh
        run: |
          $maxRetries = 3
          $retryDelay = 30
          for ($i = 1; $i -le $maxRetries; $i++) {
            Write-Host "⏳ Checkout 重试 $i/$maxRetries (等待 ${retryDelay}s 后重试)..."
            Start-Sleep -Seconds $retryDelay
            Remove-Item -Recurse -Force ".git" -ErrorAction SilentlyContinue
            Remove-Item -Force ".gitattributes" -ErrorAction SilentlyContinue
            Remove-Item -Force ".gitignore" -ErrorAction SilentlyContinue
            git clone "https://github.com/$env:GITHUB_REPOSITORY.git" .
            git checkout $env:GITHUB_SHA
            if ($LASTEXITCODE -eq 0) {
              Write-Host "✓ Checkout 重试成功 (第 $i 次)"
              return
            }
            Write-Host "✗ 第 $i 次重试失败"
          }
          throw "Checkout 失败：已重试 $maxRetries 次"
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          # v0.8.23 修复：添加 Ubuntu 镜像域名，apt-get 安装 Tauri 依赖时需要
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            crates.io:443
            static.crates.io:443
            objects.githubusercontent.com:443
            rustup.rs:443
            static.rust-lang.org:443
            index.crates.io:443
            security.ubuntu.com:443
            security.ubuntu.com:80
            archive.ubuntu.com:443
            archive.ubuntu.com:80
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - name: Cache Cargo deps
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-build-
      - name: cargo check (feature matrix)
        run: |
          cargo check --no-default-features
          cargo check --features server
          cargo check --all-features
          cargo check --features server,ml
          cargo check --features server,postgres
          cargo check --features server,qdrant
          cargo check --features server,neo4j
      - name: Explicit binary checks
        run: |
          cargo check --bin code-memory-server --features server
          cargo check --bin code-memory-benchmark --features server

      # v0.8.8 新增：桌面端跨平台编译验证（防止 macOS/Linux 桌面端 CI 失败）
      # v0.8.23 CI 修复：禁用 apt 镜像列表探测（避免 harden-runner 阻断未知镜像域名导致挂起），
      #   直接使用白名单中的 archive.ubuntu.com 和 security.ubuntu.com。
      #   添加超时选项防止挂起时死等 SIGTERM。
      # v0.8.24 CI 修复：apt-get install 也添加超时选项 + --fix-missing，
      #   根因：apt-get install 挂起时无超时保护，被 GitHub Actions 以 SIGTERM(143) 杀死。
      - name: Install Linux system dependencies (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo rm -f /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
          sudo rm -f /etc/apt/apt-mirrors.txt 2>/dev/null || true
          echo "deb http://archive.ubuntu.com/ubuntu/ noble main restricted universe multiverse" | sudo tee /etc/apt/sources.list
          echo "deb http://archive.ubuntu.com/ubuntu/ noble-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          echo "deb http://security.ubuntu.com/ubuntu/ noble-security main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          sudo apt-get update -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -y --fix-missing \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      # v0.8.9 修复：创建占位 sidecar 文件
      # tauri.conf.json 的 resources: ["lrc-sidecar*"] 要求 sidecar 文件存在
      # tauri_build::build() 在编译时检查 resources glob，找不到文件会 panic
      # cargo check 只做编译检查，不需要真正的 sidecar 二进制，占位文件即可
      - name: Create placeholder sidecar
        shell: bash
        run: |
          cd desktop/src-tauri
          if [ "${{ runner.os }}" = "Windows" ]; then
            touch lrc-sidecar.exe
          else
            touch lrc-sidecar
          fi

      - name: cargo check (desktop)
        run: cd desktop/src-tauri && cargo check

      # v0.9.7 审查修复（P0-3）：此前桌面端 80+ 单元测试（crypto/sidecar/integrity/
      #   限流/托盘/配置向导/代理读取等）从未在 CI 执行——主 crate 的 Cargo.toml
      #   `exclude` 了 desktop，导致安全关键模块长期无回归保护。
      #   此处复用已创建的占位 sidecar 与已安装的 Tauri 系统依赖，仅跑 lib 单测
      #   （--lib 避免构建需要 GUI 上下文的 bin 测试）。
      - name: cargo test (desktop lib)
        run: cd desktop/src-tauri && cargo test --lib

      # v0.8.8 新增：Tauri 配置校验（确保 targets 不是单一平台）
      - name: Tauri config lint
        run: |
          TARGETS=$(grep -o '"targets"[^,}]*' desktop/src-tauri/tauri.conf.json || echo "NOT_FOUND")
          echo "targets = $TARGETS"
          if echo "$TARGETS" | grep -q '"nsis"' && ! echo "$TARGETS" | grep -q '"all"'; then
            echo "ERROR: targets 仅包含 nsis，macOS/Linux 无 bundle 产物"
            echo "修复: 将 targets 改为 \"all\""
            exit 1
          fi
        shell: bash

  # ════════════════════════════════════════════════════════════
  # Job 6: 前端仪表盘冒烟测试（v0.8.26 CI-02 新增）
  # 仅在 static/ 目录变更时触发，减少 CI 资源消耗
  # 使用 Playwright 对仪表盘做真实浏览器交互测试
  # ════════════════════════════════════════════════════════════
  frontend-test:
    name: Frontend Browser Regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # v0.8.26 HCSE 发布合规修复：github.event.head_commit 在 push 事件中可能为 null，
    # 添加 null 保护避免表达式求值时报错
    # v0.9.7 审查修复：新增文件在 head_commit.added（不在 modified），
    # 纯新增 static/tests 文件的 commit 也必须触发本门禁
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.event.head_commit != null &&
      (contains(join(github.event.head_commit.modified, ' '), 'static/') ||
      contains(join(github.event.head_commit.modified, ' '), 'tests/frontend/') ||
      contains(join(github.event.head_commit.added, ' '), 'static/') ||
      contains(join(github.event.head_commit.added, ' '), 'tests/frontend/') ||
      contains(join(github.event.head_commit.modified, ' '), '.github/workflows/ci.yml')))
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          # v0.9.7 审查修复：本 Job 需要 npm 安装 playwright（registry.npmjs.org）
          # 与 --with-deps 的 apt 系统依赖（archive/security.ubuntu.com），
          # 此前白名单缺失这两组域名，egress block 下门禁必挂
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            crates.io:443
            static.crates.io:443
            objects.githubusercontent.com:443
            rustup.rs:443
            static.rust-lang.org:443
            index.crates.io:443
            registry.npmjs.org:443
            nodejs.org:443
            playwright.azureedge.net:443
            cdn.playwright.dev:443
            archive.ubuntu.com:443
            archive.ubuntu.com:80
            security.ubuntu.com:443
            security.ubuntu.com:80
            old-releases.ubuntu.com:443
            old-releases.ubuntu.com:80
            unpkg.com:443
            cdn.jsdelivr.net:443
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - name: Cache Cargo deps
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-frontend-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-frontend-
      - name: Build sidecar binary
        run: cargo build --release --features server
      - name: Start sidecar in background
        run: |
          nohup ./target/release/code-memory-server --src-dir . --port 3111 > sidecar.log 2>&1 &
          echo "Sidecar PID: $!"
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3111/health > /dev/null; then
              echo "sidecar 已在 3111 就绪"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "ERROR: sidecar 在 30 秒内未就绪"
              cat sidecar.log
              exit 1
            fi
            sleep 1
          done
      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Run frontend static and contract checks
        run: |
          node --check static/app.js
          node --check tests/frontend/cdp-regression.js
          node --check tests/frontend/playwright-smoke.js
          node --check tests/frontend/association-dashboard-cdp.js
          node --check tests/frontend/association-desktop-cdp.js
          node --check tests/frontend/association-user-view-check.js
          node scripts/validate_frontend_contract.js
      - name: Run Chromium browser regression
        env:
          LRC_BROWSER_BASE_URL: http://127.0.0.1:3111
          LRC_BROWSER_ARTIFACT_DIR: ${{ github.workspace }}/playwright-artifacts
        run: node tests/frontend/playwright-smoke.js
      - name: Upload browser regression evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-regression-evidence
          path: playwright-artifacts/
          if-no-files-found: warn
          retention-days: 7
      - name: Stop sidecar
        if: always()
        run: |
          pkill -f "code-memory-server" || true