name: Security Audit

# v0.7.1 P4-3：cargo-audit 安全漏洞扫描
# 触发条件：
#   1. PR（检查新引入的依赖是否有漏洞）
#   2. 定时扫描（每周一 09:00 UTC，发现新披露的漏洞）
#   3. 手动触发
on:
  pull_request:
    branches: [main, develop]
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
  schedule:
    # 每周一 09:00 UTC（北京时间 17:00）定期扫描
    - cron: '0 9 * * 1'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# v0.8.23 S1-SEC-04：最小权限原则 — 安全扫描只需要读取权限
permissions:
  contents: read

jobs:
  # ════════════════════════════════════════════════════════════
  # Job 1: cargo-audit 漏洞扫描
  # 对照 RustSec Advisory Database 检查 Cargo.lock
  # ════════════════════════════════════════════════════════════
  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    # 定时触发的扫描即使发现漏洞也不阻塞（仅报告），PR 触发的阻塞
    continue-on-error: ${{ github.event_name == 'schedule' }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            crates.io:443
            static.crates.io:443
            objects.githubusercontent.com:443
            rustup.rs:443
            static.rust-lang.org:443

      - name: Install cargo-audit
        # 使用 rustsec 官方维护的 action，自动安装 cargo-audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          # 扫描整个工作空间（含 desktop/src-tauri）
          token: ${{ secrets.GITHUB_TOKEN }}

  # ════════════════════════════════════════════════════════════
  # Job 2: 依赖许可证检查（可选，确保无 GPL 等传染性许可证）
  # ════════════════════════════════════════════════════════════
  license-check:
    name: License Check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            crates.io:443
            static.crates.io:443
            objects.githubusercontent.com:443
            rustup.rs:443
            static.rust-lang.org:443
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Install cargo-license
        # v0.8.25 V3-07 修复：添加超时保护和重试机制，防止 cargo install 长时间挂起
        # 根因：cargo install 默认无超时，网络问题可能导致 CI 挂起超过 10 分钟
        # 修复：使用 timeout 命令限制执行时间，最多允许 120 秒
        # v0.8.26 REL-02 修复：锁定版本号到 0.6.1，提升构建可复现性
        run: |
          timeout 120 cargo install cargo-license --version 0.6.1 --locked || timeout 120 cargo install cargo-license --version 0.6.1

      - name: Check dependency licenses
        # 列出所有依赖的许可证，标记非宽松许可证
        run: |
          echo "=== 依赖许可证清单 ==="
          cargo license --avoid-dev --avoid-build-scripts 2>&1 | tee licenses.txt
          # 检查是否有传染性许可证（GPL, AGPL, LGPL）
          if grep -iE 'GPL|AGPL|LGPL' licenses.txt; then
            echo "WARNING: 检测到传染性许可证依赖，请人工审核"
          else
            echo "OK: 未检测到传染性许可证"
          fi