name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.2.0)'
        required: true

# v0.8.23 S1-SEC-01：最小权限原则 — 每个 job 显式声明所需权限
# 只有 release job 需要 contents: write，其他 job 只需要 contents: read
jobs:
  # ════════════════════════════════════════════════════════════
  # Job 0: 发布前预检门禁（v0.8.8 新增）
  # 在三平台构建前执行全面检查，任一失败则阻止构建，避免资源浪费
  # 检查项：fmt + clippy + check + test + tauri配置 + MSRV + 版本号
  # ════════════════════════════════════════════════════════════
  preflight:
    name: Preflight Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          # v0.8.23 修复：添加 index.crates.io（cargo clippy 下载依赖时需要）
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            crates.io:443
            static.crates.io:443
            objects.githubusercontent.com:443
            rustup.rs:443
            static.rust-lang.org:443
            index.crates.io:443
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      # v0.8.33 HCSE R-02 双层缓存拆分：外部 crate 下载 vs 本项目编译产物
      # 外部依赖（registry / git）跨 tag 共享没问题，加速依赖下载
      - name: Cache Cargo registry (external crates only)
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      # 本项目编译产物强制 100% 隔离：key 带 SHA，restore-keys 仅保留 SHA 级前缀 → 新 tag 必然 miss
      - name: Cache target/ (project artifacts, SHA-locked)
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            target/
          key: ${{ runner.os }}-preflight-target-${{ github.sha }}-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('src/**/*.rs', 'desktop/**/*.rs', 'static/**') }}
          restore-keys: |
            ${{ runner.os }}-preflight-target-${{ github.sha }}-

      # v0.8.33 HCSE R-02 核爆级保险：即使缓存 restore 了 target/ 也清光所有编译产物
      # 与 restore-keys 删除兜底 + key 含 SHA 形成双保险，cargo 必须从 Compiling xxx v0.8.33 开始重编
      - name: Force clean target/ (defense-in-depth against stale cache)
        run: cargo clean

      # 1. 代码格式检查（与 CI Rustfmt job 对齐）
      - name: Format check
        run: cargo fmt --all -- --check

      # 2. Clippy 静态检查（与 CI Clippy job 对齐，-D warnings）
      - name: Clippy check (server feature)
        run: cargo clippy --features server -- -D warnings
      - name: Clippy check (all targets)
        run: cargo clippy --all-targets -- -D warnings

      # 3. 编译检查
      - name: Compile check
        run: cargo check --features server

      # 4. 单元测试
      - name: Unit tests
        run: cargo test --features server

      # 5. Tauri 配置验证（确保 targets 不是单一平台，防止 macOS/Linux 无 bundle）
      - name: Tauri config lint
        run: |
          echo "检查 tauri.conf.json targets 配置..."
          TARGETS=$(grep -o '"targets"[^,}]*' desktop/src-tauri/tauri.conf.json)
          echo "  targets = $TARGETS"
          # 禁止 ["nsis"] 等单平台限定（v0.8.7 根因）
          if echo "$TARGETS" | grep -q '"nsis"' && ! echo "$TARGETS" | grep -q '"all"'; then
            echo "ERROR: targets 仅包含 nsis，macOS/Linux 无 bundle 产物"
            echo "修复: 将 targets 改为 \"all\""
            exit 1
          fi
          echo "  Tauri 配置验证通过"

      # 6. MSRV 一致性检查（主项目与桌面端必须一致）
      - name: MSRV consistency check
        run: |
          MAIN_MSRV=$(grep '^rust-version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          DESKTOP_MSRV=$(grep '^rust-version' desktop/src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "主项目 MSRV: $MAIN_MSRV"
          echo "桌面端 MSRV: $DESKTOP_MSRV"
          if [ "$MAIN_MSRV" != "$DESKTOP_MSRV" ]; then
            echo "ERROR: MSRV 不一致（主项目 $MAIN_MSRV vs 桌面端 $DESKTOP_MSRV）"
            exit 1
          fi
          echo "  MSRV 一致性验证通过"

      # 7. 版本号一致性检查（10 处版本号必须同步，v0.8.14 新增 desktop Cargo.lock 检查）
      # v0.8.25 V3-01 修复：增加前端文件版本号检查（desktop/package.json、app.js、index.html）
      # 之前 preflight 漏检前端版本号，导致 app.js APP_VERSION 和 index.html 中版本号滞后
      # v0.8.25 REL-03 修复：增加 CHANGELOG.md 版本号检查，确保发布说明与版本号一致
      - name: Version consistency check
        run: |
          CARGO_VER=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          DESKTOP_VER=$(grep '^version' desktop/src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          TAURI_VER=$(grep '"version"' desktop/src-tauri/tauri.conf.json | head -1 | sed 's/.*"\(.*\)".*/\1/')
          # v0.8.13 修复：检查 Cargo.lock 中 code-memory 包的版本号
          # v0.8.12 CI 失败根因：Cargo.toml=0.8.12 但 Cargo.lock=0.8.11
          LOCK_VER=$(grep -A1 'name = "code-memory"' Cargo.lock | grep 'version' | head -1 | sed 's/.*"\(.*\)".*/\1/')
          # v0.8.14 修复：检查 desktop/src-tauri/Cargo.lock 中 lrc-desktop 包的版本号
          # 盲点根因：preflight 只检查根目录 Cargo.lock，漏检 desktop 子项目 Cargo.lock
          # 导致 lrc-desktop 版本号长期滞后（0.8.11 未同步到 0.8.14）
          DESKTOP_LOCK_VER=$(grep -A1 'name = "lrc-desktop"' desktop/src-tauri/Cargo.lock | grep 'version' | head -1 | sed 's/.*"\(.*\)".*/\1/')
          # v0.8.25 V3-01：新增前端文件版本号检查
          PKG_JSON_VER=$(grep '"version"' desktop/package.json | head -1 | sed 's/.*"\(.*\)".*/\1/')
          APP_JS_VER=$(grep "APP_VERSION" static/app.js | head -1 | sed "s/.*'\(.*\)'.*/\1/")
          INDEX_HTML_VER=$(grep 'name="version"' static/index.html | head -1 | sed 's/.*content="\(.*\)".*/\1/')
          # v0.8.25 REL-03：新增 CHANGELOG.md 版本号检查
          CHANGELOG_VER=$(grep -m1 '^## \[' CHANGELOG.md | head -1 | sed 's/.*\[\(.*\)\].*/\1/' | sed 's/^v//')
          # v0.8.26 REL-01：新增 status-version 硬编码检查（第10处版本号）
          STATUS_VER=$(grep 'id="status-version"' static/index.html | sed 's/.*v\([0-9.]*\).*/\1/')
          echo "版本号检查："
          echo "  Cargo.toml:           $CARGO_VER"
          echo "  desktop Cargo.toml:   $DESKTOP_VER"
          echo "  tauri.conf.json:      $TAURI_VER"
          echo "  Cargo.lock:           $LOCK_VER"
          echo "  desktop Cargo.lock:   $DESKTOP_LOCK_VER"
          echo "  desktop/package.json: $PKG_JSON_VER"
          echo "  static/app.js:        $APP_JS_VER"
          echo "  static/index.html:    $INDEX_HTML_VER"
          echo "  CHANGELOG.md:         $CHANGELOG_VER"
          echo "  status-version:       $STATUS_VER"
          if [ "$CARGO_VER" != "$DESKTOP_VER" ] || [ "$CARGO_VER" != "$TAURI_VER" ] || [ "$CARGO_VER" != "$LOCK_VER" ] || [ "$CARGO_VER" != "$DESKTOP_LOCK_VER" ] || [ "$CARGO_VER" != "$PKG_JSON_VER" ] || [ "$CARGO_VER" != "$APP_JS_VER" ] || [ "$CARGO_VER" != "$INDEX_HTML_VER" ] || [ "$CARGO_VER" != "$CHANGELOG_VER" ] || [ "$CARGO_VER" != "$STATUS_VER" ]; then
            echo "ERROR: 版本号不一致"
            if [ "$CARGO_VER" != "$LOCK_VER" ]; then
              echo "  提示: 根目录 Cargo.lock 版本号未同步，请本地运行 'cargo check --features server' 后提交 Cargo.lock"
            fi
            if [ "$DESKTOP_VER" != "$DESKTOP_LOCK_VER" ]; then
              echo "  提示: desktop Cargo.lock 版本号未同步，请在 desktop/src-tauri 目录运行 'cargo check' 后提交 Cargo.lock"
            fi
            if [ "$CARGO_VER" != "$PKG_JSON_VER" ]; then
              echo "  提示: desktop/package.json 版本号未同步，请手动更新"
            fi
            if [ "$CARGO_VER" != "$APP_JS_VER" ]; then
              echo "  提示: static/app.js APP_VERSION 未同步，请手动更新"
            fi
            if [ "$CARGO_VER" != "$INDEX_HTML_VER" ]; then
              echo "  提示: static/index.html meta version 未同步，请手动更新"
            fi
            if [ "$CARGO_VER" != "$CHANGELOG_VER" ]; then
              echo "  提示: CHANGELOG.md 最顶部版本号未同步，请手动更新 CHANGELOG.md"
            fi
            if [ "$CARGO_VER" != "$STATUS_VER" ]; then
              echo "  提示: static/index.html 中 id=\"status-version\" 版本号硬编码未同步，请手动更新"
            fi
            exit 1
          fi
          echo "  版本号一致性验证通过（含前端文件 + CHANGELOG）"

  # ════════════════════════════════════════════════════════════
  # Job 1: 编译 Sidecar 二进制（裸二进制，供 CLI 用户使用）
  # ════════════════════════════════════════════════════════════
  build-sidecar:
    needs: preflight
    name: Build Sidecar ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: lrc-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: lrc-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: lrc-windows-x86_64.exe

    steps:
      # v0.8.24 修复：Windows runner 网络不稳定导致 git clone 失败，
      #   根因：GitHub Actions Windows runner 偶发 TCP 连接重置 / DNS 解析失败，
      #   表现为 fetch-pack: invalid index-pack output / early EOF / curl 56 Recv failure。
      #   使用 continue-on-error + PowerShell 循环重试，最多 5 次，指数退避（15s/30s/60s/120s/240s）。
      # v0.8.39 增强：DNS 解析失败时刷新 DNS 缓存后再重试。
      - name: Checkout
        id: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        continue-on-error: true
      - name: Checkout (retry on failure)
        if: steps.checkout.outcome == 'failure'
        shell: pwsh
        run: |
          $maxRetries = 5
          $baseDelay = 15
          for ($i = 1; $i -le $maxRetries; $i++) {
            $delay = $baseDelay * [Math]::Pow(2, $i - 1)
            Write-Host "⏳ Checkout 重试 $i/$maxRetries (等待 ${delay}s 后重试)..."
            Start-Sleep -Seconds $delay
            # 刷新 DNS 缓存，解决偶发 DNS 解析失败
            Write-Host "  → 刷新 DNS 缓存..."
            ipconfig /flushdns 2>$null
            Remove-Item -Recurse -Force ".git" -ErrorAction SilentlyContinue
            Remove-Item -Force ".gitattributes" -ErrorAction SilentlyContinue
            Remove-Item -Force ".gitignore" -ErrorAction SilentlyContinue
            $repoUrl = "https://github.com/$env:GITHUB_REPOSITORY.git"
            Write-Host "  → git clone $repoUrl"
            git clone $repoUrl .
            git checkout $env:GITHUB_SHA
            if ($LASTEXITCODE -eq 0) {
              Write-Host "✓ Checkout 重试成功 (第 $i 次)"
              return
            }
            Write-Host "✗ 第 $i 次重试失败"
          }
          throw "Checkout 失败：已重试 $maxRetries 次，请手动重启 workflow"
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          # v0.8.23 修复：添加 index.crates.io（cargo build 下载依赖时需要）
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            crates.io:443
            static.crates.io:443
            objects.githubusercontent.com:443
            rustup.rs:443
            static.rust-lang.org:443
            index.crates.io:443

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VER=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VER=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry (external crates only)
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache target/ (sidecar artifacts, SHA-locked)
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            target/
          # v0.8.33 HCSE R-02：新 tag（新 SHA）100% 不会命中 → cache miss → cargo clean 后从 0 重编
          key: ${{ runner.os }}-sidecar-target-${{ github.sha }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('src/**/*.rs', 'desktop/**/*.rs', 'static/**') }}
          restore-keys: |
            ${{ runner.os }}-sidecar-target-${{ github.sha }}-${{ matrix.target }}-

      # v0.8.33 HCSE R-02：核爆级双保险 —— 无论缓存是否 restore，清空所有 target/ 编译产物
      - name: Force clean target/ (defense-in-depth against stale .rlib)
        run: cargo clean

      - name: Set reproducible build env vars
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> $GITHUB_ENV
          echo "CARGO_PROFILE_RELEASE_BUILD_OVERRIDE_DEBUG=false" >> $GITHUB_ENV
        shell: bash

      - name: Build sidecar binary
        id: build
        run: |
          VERSION="${{ steps.version.outputs.VER }}"
          case "${{ matrix.os }}" in
            ubuntu-latest)   PLATFORM="linux-x86_64" ;;
            macos-latest)    PLATFORM="macos-arm64" ;;
            windows-latest)  PLATFORM="windows-x86_64" ;;
            *)               PLATFORM="unknown" ;;
          esac
          BIN_NAME="lrc-${VERSION}-${PLATFORM}"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            BIN_NAME="${BIN_NAME}.exe"
          fi
          echo "BIN_NAME=${BIN_NAME}" >> $GITHUB_ENV

          # v0.8.15 P0-1 修复：Windows 静态链接 CRT，消除 VCRUNTIME140.dll 运行时依赖
          # 根因：用户机器未安装 VC++ Redistributable 时，sidecar 进程在入口点前崩溃
          # stderr 重定向尚未生效，日志为空，用户无法定位问题
          # v0.8.34 修复：harden-runner 阻止 OCSP 证书吊销检查，导致 Windows schannel SSL 握手失败
          # 根因：Windows 上 cargo 使用 schannel TLS 后端，需要访问 OCSP 服务器验证证书吊销
          # 但 harden-runner 的 egress-policy: block 阻止了 ocsp.sectigo.com 等域名
          # 修复：设置 CARGO_HTTP_CHECK_REVOKE=false 跳过 SSL 吊销检查
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            export RUSTFLAGS="-C target-feature=+crt-static"
            echo "已启用 CRT 静态链接 (RUSTFLAGS=$RUSTFLAGS)"
            export CARGO_HTTP_CHECK_REVOKE=false
            echo "已禁用 SSL 证书吊销检查 (CARGO_HTTP_CHECK_REVOKE=false)"
          fi

          cargo build --release --features server --target ${{ matrix.target }}
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/code-memory-server.exe "${BIN_NAME}"
          else
            cp target/${{ matrix.target }}/release/code-memory-server "${BIN_NAME}"
          fi
          echo "Built: ${BIN_NAME}"
        shell: bash

      # v0.8.39 新增：编译产物版本校验（防御性门禁）
      # 防止 CI 缓存导致"新前端+旧引擎二进制"混合产物
      # 规则：编译产物版本号必须与 ${GITHUB_REF_NAME#v} 一致
      - name: Verify binary version matches tag
        if: always()
        run: |
          VERSION_TAG="${GITHUB_REF_NAME#v}"
          echo "📋 期望版本: ${VERSION_TAG}"
          echo "📋 编译产物: ${BIN_NAME}"
          # 使用 --version 获取编译产物的版本号
          BIN_VERSION=$(./"${BIN_NAME}" --version 2>/dev/null || echo "unknown")
          echo "📋 实际版本: ${BIN_VERSION}"
          if [ "${BIN_VERSION}" != "${VERSION_TAG}" ]; then
            echo "❌ 编译产物版本 (${BIN_VERSION}) 与 tag 版本 (${VERSION_TAG}) 不匹配！"
            echo "❌ 可能旧缓存二进制被复用，请检查 cargo clean 是否生效"
            exit 1
          fi
          echo "✅ 编译产物版本一致: ${BIN_VERSION}"
        shell: bash

      - name: macOS code signing (Ad-Hoc)
        if: runner.os == 'macOS'
        run: |
          codesign --sign - --force --timestamp=none $BIN_NAME 2>/dev/null || \
            echo "  Ad-Hoc signing complete"
        shell: bash

      - name: Generate SHA256 checksum
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            certutil -hashfile $BIN_NAME SHA256 > $BIN_NAME.sha256
          else
            sha256sum $BIN_NAME > $BIN_NAME.sha256
          fi
        shell: bash

      - name: Upload sidecar artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.BIN_NAME }}
          path: |
            ${{ env.BIN_NAME }}
            ${{ env.BIN_NAME }}.sha256

  # ════════════════════════════════════════════════════════════
  # Job 2: 编译桌面端安装包（Tauri 桌面应用）
  # 生成 MSI/NSIS（Windows）和 DMG（macOS）
  # ════════════════════════════════════════════════════════════
  build-desktop:
    needs: preflight
    name: Build Desktop ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact-prefix: lrc-desktop-windows
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact-prefix: lrc-desktop-macos
          # v0.5.7 新增：Linux 桌面端构建（AppImage + deb）
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact-prefix: lrc-desktop-linux

    steps:
      # v0.8.24 修复：Windows runner 网络不稳定导致 git clone 失败，
      #   根因：GitHub Actions Windows runner 偶发 TCP 连接重置 / DNS 解析失败，
      #   表现为 fetch-pack: invalid index-pack output / early EOF / curl 56 Recv failure。
      #   使用 continue-on-error + PowerShell 循环重试，最多 5 次，指数退避（15s/30s/60s/120s/240s）。
      # v0.8.39 增强：DNS 解析失败时刷新 DNS 缓存后再重试。
      - name: Checkout
        id: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        continue-on-error: true
      - name: Checkout (retry on failure)
        if: steps.checkout.outcome == 'failure'
        shell: pwsh
        run: |
          $maxRetries = 5
          $baseDelay = 15
          for ($i = 1; $i -le $maxRetries; $i++) {
            $delay = $baseDelay * [Math]::Pow(2, $i - 1)
            Write-Host "⏳ Checkout 重试 $i/$maxRetries (等待 ${delay}s 后重试)..."
            Start-Sleep -Seconds $delay
            # 刷新 DNS 缓存，解决偶发 DNS 解析失败
            Write-Host "  → 刷新 DNS 缓存..."
            ipconfig /flushdns 2>$null
            Remove-Item -Recurse -Force ".git" -ErrorAction SilentlyContinue
            Remove-Item -Force ".gitattributes" -ErrorAction SilentlyContinue
            Remove-Item -Force ".gitignore" -ErrorAction SilentlyContinue
            $repoUrl = "https://github.com/$env:GITHUB_REPOSITORY.git"
            Write-Host "  → git clone $repoUrl"
            git clone $repoUrl .
            git checkout $env:GITHUB_SHA
            if ($LASTEXITCODE -eq 0) {
              Write-Host "✓ Checkout 重试成功 (第 $i 次)"
              return
            }
            Write-Host "✗ 第 $i 次重试失败"
          }
          throw "Checkout 失败：已重试 $maxRetries 次，请手动重启 workflow"
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          # v0.8.23 修复：添加 index.crates.io（cargo build 下载依赖时需要）
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            crates.io:443
            static.crates.io:443
            objects.githubusercontent.com:443
            rustup.rs:443
            static.rust-lang.org:443
            index.crates.io:443
            security.ubuntu.com:443
            security.ubuntu.com:80
            archive.ubuntu.com:443
            archive.ubuntu.com:80
            # v0.8.23 修复：cargo tauri build 需要下载 AppImage 工具
            release-assets.githubusercontent.com:443

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VER=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VER=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry (external crates only)
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache target/ (build-desktop sidecar subdir, SHA-locked)
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            target/
          # v0.8.33 HCSE R-02：新 tag（新 SHA）100% 不会命中任何历史缓存
          key: ${{ runner.os }}-desktop-sidecar-target-${{ github.sha }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('src/**/*.rs', 'desktop/**/*.rs', 'static/**') }}
          restore-keys: |
            ${{ runner.os }}-desktop-sidecar-target-${{ github.sha }}-${{ matrix.target }}-

      - name: Cache desktop target/ (Tauri desktop target subdir, SHA-locked)
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            desktop/src-tauri/target/
          # v0.8.33 HCSE R-02：桌面端 Tauri 编译产物 100% 与 SHA 绑定
          key: ${{ runner.os }}-desktop-tauri-target-${{ github.sha }}-${{ matrix.target }}-${{ hashFiles('desktop/**/Cargo.lock') }}-${{ hashFiles('src/**/*.rs', 'desktop/**/*.rs', 'static/**') }}
          restore-keys: |
            ${{ runner.os }}-desktop-tauri-target-${{ github.sha }}-${{ matrix.target }}-

      # v0.8.33 HCSE R-02：核爆级双保险 —— 无论缓存是否 restore 都清光两个 target/
      # 彻底杜绝任何情况的跳过重编（v0.8.31 / v0.8.32 两次事故根因）
      - name: Force clean ROOT target/ + DESKTOP target/ (defense-in-depth)
        run: |
          cargo clean
          cargo clean --manifest-path desktop/src-tauri/Cargo.toml
          echo "✅ 两个 target/ 目录全部清空，cargo 必须从 Compiling 开始重编"
        shell: bash

      # 步骤 1: 先编译 sidecar 二进制
      # v0.8.34 修复：Windows 上 harden-runner 阻止 OCSP 证书吊销检查，需禁用 SSL 吊销检查
      - name: Build sidecar binary
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            export CARGO_HTTP_CHECK_REVOKE=false
            echo "已禁用 SSL 证书吊销检查 (CARGO_HTTP_CHECK_REVOKE=false)"
          fi
          cargo build --release --features server --target ${{ matrix.target }}
          echo "Sidecar binary built at target/${{ matrix.target }}/release/"
        shell: bash

      # v0.8.39 新增：编译产物版本校验（Build Desktop 同样执行）
      - name: Verify sidecar binary version matches tag
        run: |
          VERSION_TAG="${GITHUB_REF_NAME#v}"
          echo "📋 期望版本: ${VERSION_TAG}"
          SIDECAR_BIN="target/${{ matrix.target }}/release/code-memory-server"
          if [ "${{ runner.os }}" = "Windows" ]; then
            SIDECAR_BIN="${SIDECAR_BIN}.exe"
          fi
          echo "📋 编译产物: ${SIDECAR_BIN}"
          BIN_VERSION=$("${SIDECAR_BIN}" --version 2>/dev/null || echo "unknown")
          echo "📋 实际版本: ${BIN_VERSION}"
          if [ "${BIN_VERSION}" != "${VERSION_TAG}" ]; then
            echo "❌ 编译产物版本 (${BIN_VERSION}) 与 tag 版本 (${VERSION_TAG}) 不匹配！"
            echo "❌ 可能旧缓存二进制被复用，请检查 cargo clean 是否生效"
            exit 1
          fi
          echo "✅ 编译产物版本一致: ${BIN_VERSION}"
        shell: bash

      # 步骤 2: 手动复制 sidecar 到 desktop/src-tauri/（确保 build.rs 能找到）
      # v0.5.7 修复：Linux/macOS 上文件名不带 .exe 扩展名
      - name: Sync sidecar to desktop
        run: |
          VERSION="${{ steps.version.outputs.VER }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/code-memory-server.exe desktop/src-tauri/lrc-sidecar.exe
            echo "Sidecar synced to desktop/src-tauri/lrc-sidecar.exe"
            ls -la desktop/src-tauri/lrc-sidecar.exe
          else
            cp target/${{ matrix.target }}/release/code-memory-server desktop/src-tauri/lrc-sidecar
            chmod +x desktop/src-tauri/lrc-sidecar
            echo "Sidecar synced to desktop/src-tauri/lrc-sidecar"
            ls -la desktop/src-tauri/lrc-sidecar
          fi
        shell: bash

      # 步骤 3: 安装 Tauri CLI v2
      # v0.8.35 修复：Windows runner 间歇性 DNS 解析失败（Could not resolve host: github.com）
      # 根因：GitHub Actions Windows runner 偶发 TCP 连接重置 / DNS 缓存失效
      # 修复：添加重试循环（最多 3 次，每次等待 15 秒）+ Windows 禁用 SSL 吊销检查
      - name: Install Tauri CLI
        shell: pwsh
        run: |
          $maxRetries = 3
          $retryDelay = 15
          if ("${{ runner.os }}" -eq "Windows") { $env:CARGO_HTTP_CHECK_REVOKE = "false" }
          for ($i = 1; $i -le $maxRetries; $i++) {
            Write-Host "⏳ 安装 tauri-cli ($i/$maxRetries)..."
            cargo install tauri-cli --version "^2.0" --locked 2>&1
            if ($LASTEXITCODE -eq 0) {
              Write-Host "✓ tauri-cli 安装成功"
              return
            }
            if ($i -lt $maxRetries) {
              Write-Host "✗ 第 $i 次失败，等待 ${retryDelay}s 后重试..."
              Start-Sleep -Seconds $retryDelay
            }
          }
          throw "tauri-cli 安装失败：已重试 $maxRetries 次"

      # v0.5.7 新增：Linux 系统依赖（Tauri v2 需要 webkit2gtk 等）
      # v0.8.23 CI 修复：禁用 apt 镜像列表探测（避免 harden-runner 阻断未知镜像域名导致挂起），
      #   直接使用白名单中的 archive.ubuntu.com 和 security.ubuntu.com。
      # v0.8.24 CI 修复：apt-get install 也添加超时选项 + --fix-missing，
      #   根因：apt-get install 挂起时无超时保护，被 GitHub Actions 以 SIGTERM(143) 杀死。
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo rm -f /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
          sudo rm -f /etc/apt/apt-mirrors.txt 2>/dev/null || true
          echo "deb http://archive.ubuntu.com/ubuntu/ noble main restricted universe multiverse" | sudo tee /etc/apt/sources.list
          echo "deb http://archive.ubuntu.com/ubuntu/ noble-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          echo "deb http://security.ubuntu.com/ubuntu/ noble-security main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          sudo apt-get update -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -y --fix-missing \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev
        shell: bash

      # 步骤 4: 构建 Tauri 桌面端安装包
      # sidecar 已手动复制，build.rs 会检测到哈希一致并跳过复制
      # v0.8.34 修复：Windows 上 harden-runner 阻止 OCSP 证书吊销检查，需禁用 SSL 吊销检查
      - name: Build desktop app
        run: |
          cd desktop/src-tauri
          if [ "${{ runner.os }}" = "Windows" ]; then
            export CARGO_HTTP_CHECK_REVOKE=false
            echo "已禁用 SSL 证书吊销检查 (CARGO_HTTP_CHECK_REVOKE=false)"
          fi
          cargo tauri build --target ${{ matrix.target }}
        shell: bash

      # 步骤 5: macOS Ad-Hoc 签名
      - name: macOS code signing (Ad-Hoc)
        if: runner.os == 'macOS'
        run: |
          APP_PATH=$(find desktop/src-tauri/target/${{ matrix.target }}/release/bundle -name "*.app" -type d | head -1)
          if [ -n "$APP_PATH" ]; then
            codesign --sign - --force --deep --timestamp=none "$APP_PATH" 2>/dev/null || \
              echo "  Ad-Hoc signing complete"
          fi
        shell: bash

      # 步骤 6: 收集安装包
      - name: Collect desktop artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p desktop-artifacts
          VERSION="${{ steps.version.outputs.VER }}"
          # 复制 NSIS 安装包（v0.6.0 起：不再使用 MSI/WiX，避免 GitHub 下载 WiX 超时）
          find desktop/src-tauri/target/${{ matrix.target }}/release/bundle -name "*.exe" -path "*/nsis/*" -exec cp {} desktop-artifacts/lrc-desktop-${VERSION}-windows-x86_64-setup.exe \;
          # 空产物保护：检查是否有文件被收集
          if [ -z "$(ls -A desktop-artifacts/)" ]; then
            echo "ERROR: 未找到 Windows NSIS 安装包"
            echo "bundle 目录内容："
            find desktop/src-tauri/target/${{ matrix.target }}/release/bundle -type f 2>/dev/null || echo "  (bundle 目录不存在)"
            exit 1
          fi
          ls -la desktop-artifacts/
        shell: bash

      - name: Collect desktop artifacts (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p desktop-artifacts
          VERSION="${{ steps.version.outputs.VER }}"
          # 复制 DMG 安装包
          find desktop/src-tauri/target/${{ matrix.target }}/release/bundle -name "*.dmg" -exec cp {} desktop-artifacts/lrc-desktop-${VERSION}-macos-arm64.dmg \;
          # 空产物保护：检查是否有文件被收集
          if [ -z "$(ls -A desktop-artifacts/)" ]; then
            echo "ERROR: 未找到 macOS DMG 安装包"
            echo "bundle 目录内容："
            find desktop/src-tauri/target/${{ matrix.target }}/release/bundle -type f 2>/dev/null || echo "  (bundle 目录不存在)"
            exit 1
          fi
          ls -la desktop-artifacts/
        shell: bash

      # v0.5.7 新增：Linux artifact 收集（deb + AppImage）
      - name: Collect desktop artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p desktop-artifacts
          VERSION="${{ steps.version.outputs.VER }}"
          # 复制 deb 安装包
          find desktop/src-tauri/target/${{ matrix.target }}/release/bundle -name "*.deb" -exec cp {} desktop-artifacts/lrc-desktop-${VERSION}-linux-amd64.deb \;
          # 复制 AppImage
          find desktop/src-tauri/target/${{ matrix.target }}/release/bundle -name "*.AppImage" -exec cp {} desktop-artifacts/lrc-desktop-${VERSION}-linux-x86_64.AppImage \;
          # 空产物保护：检查是否有文件被收集
          if [ -z "$(ls -A desktop-artifacts/)" ]; then
            echo "ERROR: 未找到 Linux deb/AppImage 安装包"
            echo "bundle 目录内容："
            find desktop/src-tauri/target/${{ matrix.target }}/release/bundle -type f 2>/dev/null || echo "  (bundle 目录不存在)"
            exit 1
          fi
          ls -la desktop-artifacts/
        shell: bash

      - name: Generate SHA256 checksum for desktop
        run: |
          cd desktop-artifacts
          for f in *; do
            if [ "${{ runner.os }}" = "Windows" ]; then
              certutil -hashfile "$f" SHA256 > "$f.sha256"
            else
              sha256sum "$f" > "$f.sha256"
            fi
          done
        shell: bash

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-${{ matrix.target }}
          path: desktop-artifacts/*

  # ════════════════════════════════════════════════════════════
  # Job 3: 创建 GitHub Release，上传所有产物
  # ════════════════════════════════════════════════════════════
  release:
    name: Create GitHub Release
    needs: [build-sidecar, build-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # 如果桌面端构建失败，仍然发布 sidecar 二进制
    if: always() && needs.build-sidecar.result == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          # v0.8.24 修复：添加 uploads.github.com（softprops/action-gh-release 上传产物时需要）
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            uploads.github.com:443

      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: List artifacts
        run: |
          echo "=== 所有产物 ==="
          find artifacts -type f | sort
        shell: bash

      - name: Generate install script
        run: |
          cat > install.sh << 'SCRIPT'
          #!/bin/bash
          set -e
          echo "==============================================="
          echo "  Loong Recall (LRC) One-Click Install Script"
          echo "==============================================="

          VERSION="${1:-latest}"
          BASE_URL="https://github.com/zhibaiYingChuan/LRC/releases/${VERSION}/download"

          # Detect OS and architecture
          OS=$(uname -s)
          ARCH=$(uname -m)

          if [ "$OS" = "Linux" ]; then
            BINARY="lrc-${VERSION}-linux-x86_64"
          elif [ "$OS" = "Darwin" ]; then
            BINARY="lrc-${VERSION}-macos-arm64"
          else
            echo "Unsupported OS: $OS"
            exit 1
          fi

          echo "  Downloading $BINARY ..."
          curl -L -o /tmp/lrc "$BASE_URL/$BINARY"
          chmod +x /tmp/lrc

          # Install to system path
          INSTALL_DIR="${HOME}/.local/bin"
          mkdir -p "$INSTALL_DIR"
          mv /tmp/lrc "$INSTALL_DIR/code-memory-server"

          echo "  Install complete!"
          echo "  Binary: $INSTALL_DIR/code-memory-server"
          echo ""
          echo "  Quick start:"
          echo "    code-memory-server --src-dir . --port 3099"
          echo "    Then visit http://localhost:3099/dashboard"
          SCRIPT
          chmod +x install.sh

      - name: Generate reproducible build verification guide
        run: |
          cat > REPRODUCIBLE_BUILDS.md << 'DOC'
          # Reproducible Builds Verification Guide

          Loong Recall supports reproducible builds. Any developer can verify that
          the published binary matches the source code.

          ## Verification Steps

          1. Clone the repository and checkout the corresponding tag:
             ```
             git clone https://github.com/zhibaiYingChuan/LRC.git
             cd LRC
             git checkout v<VERSION>
             ```

          2. Build with the same environment variables:
             ```
             export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
             export RUSTFLAGS="-C link-arg=-Wl,--build-id=sha1"
             cargo build --release --features server --target <YOUR_TARGET>
             ```

          3. Compare SHA256:
             ```
             sha256sum target/<YOUR_TARGET>/release/code-memory-server
             ```
             Should match the `.sha256` file in the GitHub Release.

          ## Trust Model

          Reproducible builds shift trust from "trusting the developer" to "trusting the code":
          - You don't need to trust me (the developer) didn't embed a backdoor
          - You only need to trust that you can compile the exact same binary
          - If SHA256 doesn't match, the binary does not match the source

          ## Known Limitations

          - macOS codesign affects binary hash, skip signing during verification
          - Different Rust compiler versions may produce minor differences, use the same version
          DOC
        shell: bash

      - name: Create Release
        # v0.8.25 V3-08 修复：添加 SLSA 级别标注
        # 构建来源证明由 attest-build-provenance 生成（SLSA Level 2+）
        # 详情见 https://slsa.dev/spec/v1.0/levels
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: |
            artifacts/**/*
            install.sh
            REPRODUCIBLE_BUILDS.md
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ════════════════════════════════════════════════════════════
  # Job 4: 构建产物 attestation 生成（v0.8.23 S1-REL-01 修复）
  # 使用 actions/attest-build-provenance 生成构建来源证明
  # 替代 slsa-framework/slsa-github-generator（参数不兼容问题）
  # ════════════════════════════════════════════════════════════
  provenance:
    name: Generate Build Provenance
    needs: [build-sidecar, build-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    if: always() && needs.build-sidecar.result == 'success' && needs.build-desktop.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          # v0.8.24 修复：添加 Sigstore 基础设施域名（actions/attest-build-provenance 创建签名证书时需要）
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            token.actions.githubusercontent.com:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443

      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Attest build provenance
        # v0.8.25 HCSE 安全合规：固定到完整 Commit SHA（v2 tag 对应 96b4a1ef7235a096b17240c259729fdd70c83d45）
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45
        with:
          subject-path: artifacts/**/*