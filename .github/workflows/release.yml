name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  # ════════════════════════════════════════════════════════════
  # Job 0: 发布前预检门禁（v0.8.8 新增）
  # 在三平台构建前执行全面检查，任一失败则阻止构建，避免资源浪费
  # 检查项：fmt + clippy + check + test + tauri配置 + MSRV + 版本号
  # ════════════════════════════════════════════════════════════
  preflight:
    name: Preflight Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-preflight-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-preflight-

      # 1. 代码格式检查（与 CI Rustfmt job 对齐）
      - name: Format check
        run: cargo fmt --all -- --check

      # 2. Clippy 静态检查（与 CI Clippy job 对齐，-D warnings）
      - name: Clippy check (server feature)
        run: cargo clippy --features server -- -D warnings
      - name: Clippy check (all targets)
        run: cargo clippy --all-targets -- -D warnings

      # 3. 编译检查
      - name: Compile check
        run: cargo check --features server

      # 4. 单元测试
      - name: Unit tests
        run: cargo test --features server

      # 5. Tauri 配置验证（确保 targets 不是单一平台，防止 macOS/Linux 无 bundle）
      - name: Tauri config lint
        run: |
          echo "检查 tauri.conf.json targets 配置..."
          TARGETS=$(grep -o '"targets"[^,}]*' desktop/src-tauri/tauri.conf.json)
          echo "  targets = $TARGETS"
          # 禁止 ["nsis"] 等单平台限定（v0.8.7 根因）
          if echo "$TARGETS" | grep -q '"nsis"' && ! echo "$TARGETS" | grep -q '"all"'; then
            echo "ERROR: targets 仅包含 nsis，macOS/Linux 无 bundle 产物"
            echo "修复: 将 targets 改为 \"all\""
            exit 1
          fi
          echo "  Tauri 配置验证通过"

      # 6. MSRV 一致性检查（主项目与桌面端必须一致）
      - name: MSRV consistency check
        run: |
          MAIN_MSRV=$(grep '^rust-version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          DESKTOP_MSRV=$(grep '^rust-version' desktop/src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "主项目 MSRV: $MAIN_MSRV"
          echo "桌面端 MSRV: $DESKTOP_MSRV"
          if [ "$MAIN_MSRV" != "$DESKTOP_MSRV" ]; then
            echo "ERROR: MSRV 不一致（主项目 $MAIN_MSRV vs 桌面端 $DESKTOP_MSRV）"
            exit 1
          fi
          echo "  MSRV 一致性验证通过"

      # 7. 版本号一致性检查（9 处版本号必须同步，v0.8.14 新增 desktop Cargo.lock 检查）
      - name: Version consistency check
        run: |
          CARGO_VER=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          DESKTOP_VER=$(grep '^version' desktop/src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          TAURI_VER=$(grep '"version"' desktop/src-tauri/tauri.conf.json | head -1 | sed 's/.*"\(.*\)".*/\1/')
          # v0.8.13 修复：检查 Cargo.lock 中 code-memory 包的版本号
          # v0.8.12 CI 失败根因：Cargo.toml=0.8.12 但 Cargo.lock=0.8.11
          LOCK_VER=$(grep -A1 'name = "code-memory"' Cargo.lock | grep 'version' | head -1 | sed 's/.*"\(.*\)".*/\1/')
          # v0.8.14 修复：检查 desktop/src-tauri/Cargo.lock 中 lrc-desktop 包的版本号
          # 盲点根因：preflight 只检查根目录 Cargo.lock，漏检 desktop 子项目 Cargo.lock
          # 导致 lrc-desktop 版本号长期滞后（0.8.11 未同步到 0.8.14）
          DESKTOP_LOCK_VER=$(grep -A1 'name = "lrc-desktop"' desktop/src-tauri/Cargo.lock | grep 'version' | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "版本号检查："
          echo "  Cargo.toml:          $CARGO_VER"
          echo "  desktop Cargo.toml:  $DESKTOP_VER"
          echo "  tauri.conf.json:     $TAURI_VER"
          echo "  Cargo.lock:          $LOCK_VER"
          echo "  desktop Cargo.lock:  $DESKTOP_LOCK_VER"
          if [ "$CARGO_VER" != "$DESKTOP_VER" ] || [ "$CARGO_VER" != "$TAURI_VER" ] || [ "$CARGO_VER" != "$LOCK_VER" ] || [ "$CARGO_VER" != "$DESKTOP_LOCK_VER" ]; then
            echo "ERROR: 版本号不一致"
            if [ "$CARGO_VER" != "$LOCK_VER" ]; then
              echo "  提示: 根目录 Cargo.lock 版本号未同步，请本地运行 'cargo check --features server' 后提交 Cargo.lock"
            fi
            if [ "$DESKTOP_VER" != "$DESKTOP_LOCK_VER" ]; then
              echo "  提示: desktop Cargo.lock 版本号未同步，请在 desktop/src-tauri 目录运行 'cargo check' 后提交 Cargo.lock"
            fi
            exit 1
          fi
          echo "  版本号一致性验证通过"

  # ════════════════════════════════════════════════════════════
  # Job 1: 编译 Sidecar 二进制（裸二进制，供 CLI 用户使用）
  # ════════════════════════════════════════════════════════════
  build-sidecar:
    needs: preflight
    name: Build Sidecar ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: lrc-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: lrc-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: lrc-windows-x86_64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VER=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VER=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-sidecar-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-sidecar-

      - name: Set reproducible build env vars
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> $GITHUB_ENV
          echo "CARGO_PROFILE_RELEASE_BUILD_OVERRIDE_DEBUG=false" >> $GITHUB_ENV
        shell: bash

      - name: Build sidecar binary
        id: build
        run: |
          VERSION="${{ steps.version.outputs.VER }}"
          case "${{ matrix.os }}" in
            ubuntu-latest)   PLATFORM="linux-x86_64" ;;
            macos-latest)    PLATFORM="macos-arm64" ;;
            windows-latest)  PLATFORM="windows-x86_64" ;;
            *)               PLATFORM="unknown" ;;
          esac
          BIN_NAME="lrc-${VERSION}-${PLATFORM}"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            BIN_NAME="${BIN_NAME}.exe"
          fi
          echo "BIN_NAME=${BIN_NAME}" >> $GITHUB_ENV

          # v0.8.15 P0-1 修复：Windows 静态链接 CRT，消除 VCRUNTIME140.dll 运行时依赖
          # 根因：用户机器未安装 VC++ Redistributable 时，sidecar 进程在入口点前崩溃
          # stderr 重定向尚未生效，日志为空，用户无法定位问题
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            export RUSTFLAGS="-C target-feature=+crt-static"
            echo "已启用 CRT 静态链接 (RUSTFLAGS=$RUSTFLAGS)"
          fi

          cargo build --release --features server --target ${{ matrix.target }}
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/code-memory-server.exe "${BIN_NAME}"
          else
            cp target/${{ matrix.target }}/release/code-memory-server "${BIN_NAME}"
          fi
          echo "Built: ${BIN_NAME}"
        shell: bash

      - name: macOS code signing (Ad-Hoc)
        if: runner.os == 'macOS'
        run: |
          codesign --sign - --force --timestamp=none $BIN_NAME 2>/dev/null || \
            echo "  Ad-Hoc signing complete"
        shell: bash

      - name: Generate SHA256 checksum
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            certutil -hashfile $BIN_NAME SHA256 > $BIN_NAME.sha256
          else
            sha256sum $BIN_NAME > $BIN_NAME.sha256
          fi
        shell: bash

      - name: Upload sidecar artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BIN_NAME }}
          path: |
            ${{ env.BIN_NAME }}
            ${{ env.BIN_NAME }}.sha256

  # ════════════════════════════════════════════════════════════
  # Job 2: 编译桌面端安装包（Tauri 桌面应用）
  # 生成 MSI/NSIS（Windows）和 DMG（macOS）
  # ════════════════════════════════════════════════════════════
  build-desktop:
    needs: preflight
    name: Build Desktop ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact-prefix: lrc-desktop-windows
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact-prefix: lrc-desktop-macos
          # v0.5.7 新增：Linux 桌面端构建（AppImage + deb）
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact-prefix: lrc-desktop-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VER=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VER=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo deps (sidecar)
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-sidecar-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-sidecar-

      - name: Cache Cargo deps (desktop)
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            desktop/src-tauri/target/
          key: ${{ runner.os }}-desktop-${{ hashFiles('desktop/**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-desktop-

      # 步骤 1: 先编译 sidecar 二进制
      - name: Build sidecar binary
        run: |
          cargo build --release --features server --target ${{ matrix.target }}
          echo "Sidecar binary built at target/${{ matrix.target }}/release/"
        shell: bash

      # 步骤 2: 手动复制 sidecar 到 desktop/src-tauri/（确保 build.rs 能找到）
      # v0.5.7 修复：Linux/macOS 上文件名不带 .exe 扩展名
      - name: Sync sidecar to desktop
        run: |
          VERSION="${{ steps.version.outputs.VER }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/code-memory-server.exe desktop/src-tauri/lrc-sidecar.exe
            echo "Sidecar synced to desktop/src-tauri/lrc-sidecar.exe"
            ls -la desktop/src-tauri/lrc-sidecar.exe
          else
            cp target/${{ matrix.target }}/release/code-memory-server desktop/src-tauri/lrc-sidecar
            chmod +x desktop/src-tauri/lrc-sidecar
            echo "Sidecar synced to desktop/src-tauri/lrc-sidecar"
            ls -la desktop/src-tauri/lrc-sidecar
          fi
        shell: bash

      # 步骤 3: 安装 Tauri CLI v2
      - name: Install Tauri CLI
        run: |
          cargo install tauri-cli --version "^2.0" --locked || \
            cargo install tauri-cli --version "^2.0"
        shell: bash

      # v0.5.7 新增：Linux 系统依赖（Tauri v2 需要 webkit2gtk 等）
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev
        shell: bash

      # 步骤 4: 构建 Tauri 桌面端安装包
      # sidecar 已手动复制，build.rs 会检测到哈希一致并跳过复制
      - name: Build desktop app
        run: |
          cd desktop/src-tauri
          cargo tauri build --target ${{ matrix.target }}
        shell: bash

      # 步骤 5: macOS Ad-Hoc 签名
      - name: macOS code signing (Ad-Hoc)
        if: runner.os == 'macOS'
        run: |
          APP_PATH=$(find desktop/src-tauri/target/${{ matrix.target }}/release/bundle -name "*.app" -type d | head -1)
          if [ -n "$APP_PATH" ]; then
            codesign --sign - --force --deep --timestamp=none "$APP_PATH" 2>/dev/null || \
              echo "  Ad-Hoc signing complete"
          fi
        shell: bash

      # 步骤 6: 收集安装包
      - name: Collect desktop artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p desktop-artifacts
          VERSION="${{ steps.version.outputs.VER }}"
          # 复制 NSIS 安装包（v0.6.0 起：不再使用 MSI/WiX，避免 GitHub 下载 WiX 超时）
          find desktop/src-tauri/target/${{ matrix.target }}/release/bundle -name "*.exe" -path "*/nsis/*" -exec cp {} desktop-artifacts/lrc-desktop-${VERSION}-windows-x86_64-setup.exe \;
          # 空产物保护：检查是否有文件被收集
          if [ -z "$(ls -A desktop-artifacts/)" ]; then
            echo "ERROR: 未找到 Windows NSIS 安装包"
            echo "bundle 目录内容："
            find desktop/src-tauri/target/${{ matrix.target }}/release/bundle -type f 2>/dev/null || echo "  (bundle 目录不存在)"
            exit 1
          fi
          ls -la desktop-artifacts/
        shell: bash

      - name: Collect desktop artifacts (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p desktop-artifacts
          VERSION="${{ steps.version.outputs.VER }}"
          # 复制 DMG 安装包
          find desktop/src-tauri/target/${{ matrix.target }}/release/bundle -name "*.dmg" -exec cp {} desktop-artifacts/lrc-desktop-${VERSION}-macos-arm64.dmg \;
          # 空产物保护：检查是否有文件被收集
          if [ -z "$(ls -A desktop-artifacts/)" ]; then
            echo "ERROR: 未找到 macOS DMG 安装包"
            echo "bundle 目录内容："
            find desktop/src-tauri/target/${{ matrix.target }}/release/bundle -type f 2>/dev/null || echo "  (bundle 目录不存在)"
            exit 1
          fi
          ls -la desktop-artifacts/
        shell: bash

      # v0.5.7 新增：Linux artifact 收集（deb + AppImage）
      - name: Collect desktop artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p desktop-artifacts
          VERSION="${{ steps.version.outputs.VER }}"
          # 复制 deb 安装包
          find desktop/src-tauri/target/${{ matrix.target }}/release/bundle -name "*.deb" -exec cp {} desktop-artifacts/lrc-desktop-${VERSION}-linux-amd64.deb \;
          # 复制 AppImage
          find desktop/src-tauri/target/${{ matrix.target }}/release/bundle -name "*.AppImage" -exec cp {} desktop-artifacts/lrc-desktop-${VERSION}-linux-x86_64.AppImage \;
          # 空产物保护：检查是否有文件被收集
          if [ -z "$(ls -A desktop-artifacts/)" ]; then
            echo "ERROR: 未找到 Linux deb/AppImage 安装包"
            echo "bundle 目录内容："
            find desktop/src-tauri/target/${{ matrix.target }}/release/bundle -type f 2>/dev/null || echo "  (bundle 目录不存在)"
            exit 1
          fi
          ls -la desktop-artifacts/
        shell: bash

      - name: Generate SHA256 checksum for desktop
        run: |
          cd desktop-artifacts
          for f in *; do
            if [ "${{ runner.os }}" = "Windows" ]; then
              certutil -hashfile "$f" SHA256 > "$f.sha256"
            else
              sha256sum "$f" > "$f.sha256"
            fi
          done
        shell: bash

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.target }}
          path: desktop-artifacts/*

  # ════════════════════════════════════════════════════════════
  # Job 3: 创建 GitHub Release，上传所有产物
  # ════════════════════════════════════════════════════════════
  release:
    name: Create GitHub Release
    needs: [build-sidecar, build-desktop]
    runs-on: ubuntu-latest
    # 如果桌面端构建失败，仍然发布 sidecar 二进制
    if: always() && needs.build-sidecar.result == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: List artifacts
        run: |
          echo "=== 所有产物 ==="
          find artifacts -type f | sort
        shell: bash

      - name: Generate install script
        run: |
          cat > install.sh << 'SCRIPT'
          #!/bin/bash
          set -e
          echo "==============================================="
          echo "  Loong Recall (LRC) One-Click Install Script"
          echo "==============================================="

          VERSION="${1:-latest}"
          BASE_URL="https://github.com/zhibaiYingChuan/LRC/releases/${VERSION}/download"

          # Detect OS and architecture
          OS=$(uname -s)
          ARCH=$(uname -m)

          if [ "$OS" = "Linux" ]; then
            BINARY="lrc-${VERSION}-linux-x86_64"
          elif [ "$OS" = "Darwin" ]; then
            BINARY="lrc-${VERSION}-macos-arm64"
          else
            echo "Unsupported OS: $OS"
            exit 1
          fi

          echo "  Downloading $BINARY ..."
          curl -L -o /tmp/lrc "$BASE_URL/$BINARY"
          chmod +x /tmp/lrc

          # Install to system path
          INSTALL_DIR="${HOME}/.local/bin"
          mkdir -p "$INSTALL_DIR"
          mv /tmp/lrc "$INSTALL_DIR/code-memory-server"

          echo "  Install complete!"
          echo "  Binary: $INSTALL_DIR/code-memory-server"
          echo ""
          echo "  Quick start:"
          echo "    code-memory-server --src-dir . --port 3099"
          echo "    Then visit http://localhost:3099/dashboard"
          SCRIPT
          chmod +x install.sh

      - name: Generate reproducible build verification guide
        run: |
          cat > REPRODUCIBLE_BUILDS.md << 'DOC'
          # Reproducible Builds Verification Guide

          Loong Recall supports reproducible builds. Any developer can verify that
          the published binary matches the source code.

          ## Verification Steps

          1. Clone the repository and checkout the corresponding tag:
             ```
             git clone https://github.com/zhibaiYingChuan/LRC.git
             cd LRC
             git checkout v<VERSION>
             ```

          2. Build with the same environment variables:
             ```
             export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
             export RUSTFLAGS="-C link-arg=-Wl,--build-id=sha1"
             cargo build --release --features server --target <YOUR_TARGET>
             ```

          3. Compare SHA256:
             ```
             sha256sum target/<YOUR_TARGET>/release/code-memory-server
             ```
             Should match the `.sha256` file in the GitHub Release.

          ## Trust Model

          Reproducible builds shift trust from "trusting the developer" to "trusting the code":
          - You don't need to trust me (the developer) didn't embed a backdoor
          - You only need to trust that you can compile the exact same binary
          - If SHA256 doesn't match, the binary does not match the source

          ## Known Limitations

          - macOS codesign affects binary hash, skip signing during verification
          - Different Rust compiler versions may produce minor differences, use the same version
          DOC
        shell: bash

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/**/*
            install.sh
            REPRODUCIBLE_BUILDS.md
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
