name: 预编译发布

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (如 v0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: 构建 ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: lrc-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: lrc-macos-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: lrc-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: lrc-windows-x86_64.exe

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存 Cargo 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: 设置可重现构建环境变量
        run: |
          # 可重现构建（Reproducible Builds）
          # 质疑三解决方案：让社区中的任何人都能用相同源码编译出与发布完全一致的二进制文件
          # 这将信任从对"人"的信任，转移为对"代码"和"数学"的信任
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> $GITHUB_ENV
          echo "RUSTFLAGS=-C link-arg=-Wl,--build-id=sha1" >> $GITHUB_ENV
          echo "CARGO_PROFILE_RELEASE_BUILD_OVERRIDE_DEBUG=false" >> $GITHUB_ENV
        shell: bash

      - name: 构建 Release
        run: |
          cargo build --release --features server,ml --target ${{ matrix.target }}
          # 重命名二进制文件
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/code-memory-server.exe ${{ matrix.artifact }}
          else
            cp target/${{ matrix.target }}/release/code-memory-server ${{ matrix.artifact }}
          fi
        shell: bash

      - name: macOS 代码签名（Ad-Hoc）
        if: runner.os == 'macOS'
        run: |
          # Ad-Hoc 签名：允许在本地 macOS 上运行，不触发 Gatekeeper 完全阻止
          # 注意：要完全消除 Gatekeeper 警告需要 Apple Developer 证书
          codesign --sign - --force --timestamp=none ${{ matrix.artifact }} 2>/dev/null || \
            echo "  ⚠ Ad-Hoc 签名完成（如需完全消除 Gatekeeper 警告，请配置 Apple Developer 证书）"
        shell: bash

      - name: 生成 SHA256 校验和
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            certutil -hashfile ${{ matrix.artifact }} SHA256 > ${{ matrix.artifact }}.sha256
          else
            sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256
          fi
        shell: bash

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256

  release:
    name: 创建 GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 生成安装脚本
        run: |
          cat > install.sh << 'SCRIPT'
          #!/bin/bash
          set -e
          echo "═══════════════════════════════════════════"
          echo "  Loong Recall (LRC / 忆) 一键安装脚本"
          echo "═══════════════════════════════════════════"

          # 检测操作系统和架构
          OS=$(uname -s)
          ARCH=$(uname -m)

          if [ "$OS" = "Linux" ]; then
            BINARY="lrc-linux-x86_64"
          elif [ "$OS" = "Darwin" ]; then
            if [ "$ARCH" = "arm64" ]; then
              BINARY="lrc-macos-arm64"
            else
              BINARY="lrc-macos-x86_64"
            fi
          else
            echo "不支持的操作系统: $OS"
            exit 1
          fi

          VERSION="${1:-latest}"
          BASE_URL="https://github.com/zhibaiYingChuan/LRC/releases/${VERSION}/download"

          echo "  下载 $BINARY ..."
          curl -L -o /tmp/lrc "$BASE_URL/$BINARY"
          chmod +x /tmp/lrc

          # 安装到系统路径
          INSTALL_DIR="${HOME}/.local/bin"
          mkdir -p "$INSTALL_DIR"
          mv /tmp/lrc "$INSTALL_DIR/code-memory-server"

          echo "  ✓ 安装完成！"
          echo "  可执行文件: $INSTALL_DIR/code-memory-server"
          echo ""
          echo "  快速开始:"
          echo "    code-memory-server --src-dir . --port 3099"
          echo "    然后访问 http://localhost:3099/dashboard"
          SCRIPT
          chmod +x install.sh

      - name: 生成可重现构建验证说明
        run: |
          cat > REPRODUCIBLE_BUILDS.md << 'DOC'
          # 可重现构建验证指南

          Loong Recall 支持可重现构建。任何开发者都可以验证发布的二进制文件与源码一致。

          ## 验证步骤

          1. 克隆仓库并切换到对应的 tag：
             ```
             git clone https://github.com/zhibaiYingChuan/LRC.git
             cd LRC
             git checkout v<VERSION>
             ```

          2. 使用相同的环境变量编译：
             ```
             export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
             export RUSTFLAGS="-C link-arg=-Wl,--build-id=sha1"
             cargo build --release --features server,ml --target <YOUR_TARGET>
             ```

          3. 对比 SHA256：
             ```
             sha256sum target/<YOUR_TARGET>/release/code-memory-server
             ```
             应与 GitHub Release 中的 `.sha256` 文件一致。

          ## 信任模型

          可重现构建将信任从"信任开发者"转移为"信任代码"：
          - 你不需要相信我（开发者）没有在二进制中植入后门
          - 你只需要相信你可以自己编译出完全相同的二进制文件
          - 如果 SHA256 不一致，说明二进制文件与源码不匹配

          ## 已知限制

          - macOS 的 codesign 会影响二进制哈希，验证时需跳过签名
          - 不同 Rust 编译器版本可能产生微小差异，建议使用相同版本
          DOC
        shell: bash

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
            install.sh
            REPRODUCIBLE_BUILDS.md
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}