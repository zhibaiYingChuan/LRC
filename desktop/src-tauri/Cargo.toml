[package]
name = "lrc-desktop"
version = "0.8.31"
description = "LRC Desktop — 本地优先的 AI 代码记忆桌面应用"
authors = ["LRC Team"]
edition = "2021"
# v0.7.1 P2-5：声明最低支持 Rust 版本（MSRV）
# v0.8.8：统一 MSRV 到 1.80（与主项目一致，LazyLock 需要 1.80+，Tauri 2.x 要求 1.77.2+）
rust-version = "1.80"

[lib]
name = "lrc_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.10"           # SHA-256 哈希（v0.5.1: build.rs 二进制验证）

[dependencies]
# Tauri 桌面框架（tray-icon feature 内置系统托盘支持）
# v0.5.4 P2-16 修复：启用 custom-protocol feature，确保生产构建时前端资源被正确嵌入
# 根因：未启用 custom-protocol 时，tauri::generate_context!() 中 dev=true，
#       会跳过 frontendDist 资源嵌入，导致 WebView2 显示 about:blank 空白页面
# 修复：启用 custom-protocol feature，使 dev=false，正确嵌入前端资源
tauri = { version = "2", features = ["tray-icon", "custom-protocol"] }
tauri-plugin-shell = "2"
# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 运行时
tokio = { version = "1", features = ["full"] }
# 日志
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"  # v0.5.7 修复 L-5：原子日志轮转
# 错误处理
anyhow = "1"
# 打开浏览器/文件
open = "5"
# 文件选择对话框
rfd = "0.15"
# 用户目录获取（v0.5.6：全局规则文件写入）
dirs = "5"
# HTTP 客户端（sidecar 健康检查）
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# time crate 版本约束（兼容 0.3.x 系列，避免与 tauri-utils 冲突）
time = "0.3.36"
# v0.5.12 新增：递归扫描目录（SpaceSniffer 式项目索引）
walkdir = "2"

# ── L2 保密层依赖 ──
obfstr = "0.4"          # 编译时字符串混淆（MVP 阶段必须）
static_assertions = "1"  # 编译时断言
sha2 = "0.10"           # SHA-256 哈希（完整性校验）

# ── L1 数据加密依赖 ──
aes-gcm = "0.10"        # AES-256-GCM 加密（API Key 存储）
rand = "0.8"            # 随机数生成（nonce/salt）
base64 = "0.22"         # Base64 编码（加密数据序列化）

# ── Windows API（L2 反调试检测）──
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_Security_Cryptography",
] }

# ── Unix API（macOS/Linux 反调试检测 + 进程管理）──
# integrity.rs: libc::ptrace(PT_DENY_ATTACH) macOS 反调试
# sidecar_manager.rs: libc::kill(pid, 0) 进程存活检测
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# ── L2 保密构建配置（反逆向工程）──
[profile.release]
lto = true             # 链接时优化（减少二进制大小 + 增加混淆效果）
codegen-units = 1      # 单代码生成单元（最大化内联和混淆）
panic = "abort"        # 避免 panic unwind 信息泄露
strip = "symbols"      # 剥离符号表（L2-OBF-5）
opt-level = "s"        # 优化体积（减少特征）
# v0.5.4 修复：启用溢出检查，防止整数溢出导致的安全漏洞
# 性能影响约 1-3%，但可防止缓冲区溢出、索引越界等 UB 被利用
overflow-checks = true

# 注：v1.1 阶段升级为 OLLVM 完整集成
# [profile.release-obfuscated]
# inherits = "release"
# 通过 build.rs 注入 OLLVM 编译标志：
#   -mllvm -fla        (Control Flow Flattening)
#   -mllvm -sub        (Instruction Substitution)
#   -mllvm -bcf        (Bogus Control Flow)
