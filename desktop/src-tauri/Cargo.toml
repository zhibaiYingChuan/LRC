[package]
name = "lrc-desktop"
version = "0.2.0"
description = "LRC Desktop — 本地优先的 AI 代码记忆桌面应用"
authors = ["LRC Team"]
edition = "2021"

[lib]
name = "lrc_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri 桌面框架（tray-icon feature 内置系统托盘支持）
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 运行时
tokio = { version = "1", features = ["full"] }
# 日志
tracing = "0.1"
tracing-subscriber = "0.3"
# 错误处理
anyhow = "1"
# 打开浏览器/文件
open = "5"
# HTTP 客户端（sidecar 健康检查）
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# 锁定 time crate 版本，避免与 tauri-utils 冲突
time = "=0.3.36"

# ── L2 保密层依赖 ──
obfstr = "0.4"          # 编译时字符串混淆（MVP 阶段必须）
static_assertions = "1"  # 编译时断言

# ── L1 数据加密依赖 ──
aes-gcm = "0.10"        # AES-256-GCM 加密（API Key 存储）
rand = "0.8"            # 随机数生成（nonce/salt）
base64 = "0.22"         # Base64 编码（加密数据序列化）

# ── Windows API（L2 反调试检测）──
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Threading",
    "Win32_Foundation",
] }

# ── L2 保密构建配置（反逆向工程）──
[profile.release]
lto = true             # 链接时优化（减少二进制大小 + 增加混淆效果）
codegen-units = 1      # 单代码生成单元（最大化内联和混淆）
panic = "abort"        # 避免 panic unwind 信息泄露
strip = "symbols"      # 剥离符号表（L2-OBF-5）
opt-level = "s"        # 优化体积（减少特征）

# 注：v1.1 阶段升级为 OLLVM 完整集成
# [profile.release-obfuscated]
# inherits = "release"
# 通过 build.rs 注入 OLLVM 编译标志：
#   -mllvm -fla        (Control Flow Flattening)
#   -mllvm -sub        (Instruction Substitution)
#   -mllvm -bcf        (Bogus Control Flow)
