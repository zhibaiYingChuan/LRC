[workspace]
# 桌面端 Tauri 项目是独立的 Cargo 工作区，不参与主项目构建
exclude = ["desktop/src-tauri"]

[package]
name = "code-memory"
version = "0.8.7"
edition = "2021"
# v0.7.1 P2-5：声明最低支持 Rust 版本（MSRV）
# v0.8.8：提升到 1.80（std::sync::LazyLock 需要 1.80+）
# 基于依赖矩阵：axum 0.7 (1.66+)、tokio 1.x (1.63+)、reqwest (1.64+)、LazyLock (1.80+)
rust-version = "1.80"
authors = ["Open Source Contributors"]
description = "Loong Recall (LRC) — AI 永久记忆系统，为 AI 助手提供语义代码搜索与跨会话记忆"
license = "Apache-2.0 OR LicenseRef-DaoTi-Research"
repository = "https://github.com/zhibaiYingChuan/LRC"

[features]
# v0.5.5 内存优化：默认不启用 ml feature，减少 sidecar 基线内存占用
# LRC Desktop 的 sidecar 默认使用 Fast Match（统计编码器），无需 ML 依赖
# 如需 Smart Match（语义编码），使用 cargo build --features server,ml
default = ["server"]
# 启用 candle + CodeBERT 真实语义编码（体积大 ~200MB）
# 仅在需要 Smart Match（离线语义搜索）时启用
ml = ["candle-core", "candle-nn", "candle-transformers", "tokenizers", "hf-hub", "ureq"]
# 启用 MCP HTTP 服务（axum + tokio）
# v0.6.0+：ureq 用于嵌入模型管理 API 的镜像源连通性测试 + model_downloader 模块
server = ["axum", "tokio", "tower", "tower-http", "reqwest", "webbrowser", "ureq", "socket2"]
# PostgreSQL 持久化后端（需运行中的 PostgreSQL 服务）
postgres = ["sqlx", "tokio"]
# Qdrant 向量存储后端（通过 HTTP API，无需额外依赖）
qdrant = ["reqwest", "tokio"]
# Neo4j 图存储后端（通过 HTTP API，无需额外依赖）
neo4j = ["reqwest", "tokio"]
# 桌面仪表盘 feature — 启用浏览器自动打开 + 内置 HTTP 仪表盘
dashboard = ["webbrowser", "server"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
dirs-next = "2"
async-trait = "0.1"
tempfile = "3"
# 项目指纹计算（SHA256哈希）
sha2 = "0.10"

# L1 数据加密（API Key 安全存储）
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"

# 桌面仪表盘依赖 — 双击 exe 打开浏览器查看记忆管理面板
webbrowser = { version = "0.8", optional = true }

# PostgreSQL 依赖（optional，postgres feature 启用）
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono"], optional = true }

# CodeBERT 真实语义编码依赖（optional，ml feature 启用）
candle-core = { version = "0.10", optional = true }
candle-nn = { version = "0.10", optional = true }
candle-transformers = { version = "0.10", optional = true }
tokenizers = { version = "0.20", optional = true }
hf-hub = { version = "0.4", optional = true }
ureq = { version = "2", optional = true }

# MCP HTTP 服务依赖（optional，server feature 启用）
# v0.7.1 P2-4：axum 0.7 → 0.8 升级，tower-http 0.5 → 0.6
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "io-util", "io-std", "signal"], optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }
reqwest = { version = "0.12", features = ["json"], optional = true }
# v0.8.1：TCP keepalive 配置（防止 sidecar 连接池泄漏）
socket2 = { version = "0.6", optional = true }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "code-memory-server"
path = "src/bin/server.rs"
required-features = ["server"]

[[bin]]
name = "code-memory-benchmark"
path = "src/bin/benchmark.rs"
required-features = ["server"]

[build-dependencies]
sha2 = "0.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
# v0.5.4 修复：启用溢出检查，防止整数溢出导致的安全漏洞
overflow-checks = true
debug = false
debug-assertions = false
incremental = false

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
] }