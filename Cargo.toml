[package]
name = "code-memory"
version = "0.1.0"
edition = "2021"
authors = ["Open Source Contributors"]
description = "Loong Recall (L-RC / 忆) — 源于道体道枢层的代码语义记忆 MCP 服务，为 AI 助手提供项目代码上下文记忆"
license = "Apache-2.0 OR LicenseRef-DaoTi-Research"
repository = "https://github.com/zhibaiYingChuan/LRC"

[features]
default = ["server"]
# 启用 candle + CodeBERT 真实语义编码（体积大 ~200MB）
ml = ["candle-core", "candle-nn", "candle-transformers", "tokenizers", "hf-hub"]
# 启用 MCP HTTP 服务（axum + tokio）
server = ["axum", "tokio", "tower-http"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
dirs-next = "2"

# CodeBERT 真实语义编码依赖（optional，ml feature 启用）
candle-core = { version = "0.10", optional = true }
candle-nn = { version = "0.10", optional = true }
candle-transformers = { version = "0.10", optional = true }
tokenizers = { version = "0.20", optional = true }
hf-hub = { version = "0.3", optional = true }

# MCP HTTP 服务依赖（optional，server feature 启用）
axum = { version = "0.7", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "io-util", "io-std"], optional = true }
tower-http = { version = "0.5", features = ["cors"], optional = true }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "code-memory-server"
path = "src/bin/server.rs"
required-features = ["server"]