[workspace]

[package]
name = "code-memory"
version = "0.3.0"
edition = "2021"
authors = ["Open Source Contributors"]
description = "Loong Recall (L-RC / 忆) — 几何坐标驱动的 AI 永久记忆系统，为 AI 助手提供语义代码搜索与跨会话记忆演化"
license = "Apache-2.0 OR LicenseRef-DaoTi-Research"
repository = "https://github.com/zhibaiYingChuan/LRC"

[features]
default = ["server", "ml"]
# 默认启用 ml feature：优先使用语义编码器（BGE-small-zh / all-MiniLM-L6）
# 如果 HuggingFace 不可达或模型未安装，自动降级为统计编码器
# 如需纯统计模式（无 ML 依赖、零外部下载），使用 --no-default-features
# 启用 candle + CodeBERT 真实语义编码（体积大 ~200MB）
ml = ["candle-core", "candle-nn", "candle-transformers", "tokenizers", "hf-hub", "ureq"]
# 启用 MCP HTTP 服务（axum + tokio）
server = ["axum", "tokio", "tower", "tower-http", "reqwest"]
# PostgreSQL 持久化后端（需运行中的 PostgreSQL 服务）
postgres = ["sqlx", "tokio"]
# Qdrant 向量存储后端（通过 HTTP API，无需额外依赖）
qdrant = ["reqwest", "tokio"]
# Neo4j 图存储后端（通过 HTTP API，无需额外依赖）
neo4j = ["reqwest", "tokio"]
# 桌面仪表盘 feature — 启用浏览器自动打开 + 内置 HTTP 仪表盘
dashboard = ["webbrowser", "server"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
dirs-next = "2"
async-trait = "0.1"
tempfile = "3"

# 桌面仪表盘依赖 — 双击 exe 打开浏览器查看记忆管理面板
webbrowser = { version = "0.8", optional = true }

# PostgreSQL 依赖（optional，postgres feature 启用）
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono"], optional = true }

# CodeBERT 真实语义编码依赖（optional，ml feature 启用）
candle-core = { version = "0.10", optional = true }
candle-nn = { version = "0.10", optional = true }
candle-transformers = { version = "0.10", optional = true }
tokenizers = { version = "0.20", optional = true }
hf-hub = { version = "0.4", optional = true }
ureq = { version = "2", optional = true }

# MCP HTTP 服务依赖（optional，server feature 启用）
axum = { version = "0.7", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "io-util", "io-std", "signal"], optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.5", features = ["cors"], optional = true }
reqwest = { version = "0.12", features = ["json"], optional = true }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "code-memory-server"
path = "src/bin/server.rs"
required-features = ["server"]

[[bin]]
name = "code-memory-benchmark"
path = "src/bin/benchmark.rs"
required-features = ["server"]

[build-dependencies]
sha2 = "0.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false
debug = false
debug-assertions = false
incremental = false

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }